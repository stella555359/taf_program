# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################
  externalNetwork:
    fhm:
      vlanInfo:
        vid: 112
        pcp: ""
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        type: "physical"
        role:
        - "fhm"
    # - CB009567 max support 12 RANNIC/36 cells, max support 36 fhuc interfaces.
    # - three fhuc interfaces mapping ecpri0-ecpri2 of one RANNIC.
    # - Note: currently only support single vlan for each RANNIC, so please only set the vid value
    #         of the first fhuc for each RANNIC such as fhuc1/fhuc4/fhuc7/fhuc10...fhuc34
    # - fhuc1-fhuc3 mapping ecpri0-ecpri2 of the RANNIC on node which ahm-0 pod
    fhuc1:
      vlanInfo:
        vid: "111"
        pcp: "7"
    fhuc2:
      vlanInfo:
        vid: ""
        pcp: "7"
    fhuc3:
      vlanInfo:
        vid: ""
        pcp: "7"
