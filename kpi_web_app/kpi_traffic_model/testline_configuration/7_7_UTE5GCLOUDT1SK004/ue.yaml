   address: '10.84.168.70'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.54'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@SKA-HC14s17-1:~$'        # OPTIONAL regex that should match prompt on App Server

UePC1: &UE_PC
  ue_pc_address: 'PLKR-SG01-32.p01.ska-lab.nsn-rdnet.net'    # UE PC IP address
  ue_pc_login: 'pzkrk'
  ue_pc_password: 'NokiaBts2003'
  ue_pc_expected_prompt: 'pzkrk@PLKR-SG01-32'
  ue_pc_port: '8080'

UE_POOLS:
    TafUeAndroidPool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'd26a0d11'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    server_close_delay: 500
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        << : *UE_PC
                        qualcomm_prototype: True
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: 1
