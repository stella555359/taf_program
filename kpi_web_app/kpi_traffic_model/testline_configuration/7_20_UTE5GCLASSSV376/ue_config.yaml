UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0xFFFF      # 0x566E05 0xCDEBC03 0xCDEBD01   0x17908                  Cell ID to which UE should attach
                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '383c3354'             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                        # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        com_port: '7'                     # Diagnostic COM ID 
                        ue_pc_ip: '10.0.97.77'            # UE PC IP address
                        ue_pc_host: '10.0.97.77'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'cv5g2_7'                  # SSH login to UE PC
                        password: 'M@r!Ne27'              # SSH password to UE PC
                        server_dir: 'C:/UE_Manager/ue_manager_files/pyro_server'       # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'      #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/UE_Manager/ue_manager_files/pyro_server/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                       
                        processes_to_kill:   # phrases based on which processes names will be found
                            - 'putty'        # and killed before test (case insensitive)
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        
                        data_transfer:                     # Application Server (for Iperf) details
                            ssh:
                                host: '10.14.42.209'       # Application Server IP
                                user: 'ran5g'              # Application Server SSH login
                                password: 'nokia2018'      # Application Server SSH password
                            iperf_interface_ip: '10.11.70.78'         # Application Server interface used for data transfer (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.11.70.78' # Using TL323 trafic VM bc 376 not responding
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'    # Allowed packet loss in %