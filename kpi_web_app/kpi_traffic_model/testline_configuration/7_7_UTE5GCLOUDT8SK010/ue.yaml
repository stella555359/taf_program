AppServer1: &APP_1                              # 1st application server definition
   address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.60'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@SKA-HC14-15-AppServer:~$'        # OPTIONAL regex that should match prompt on App Server

UePC1: &UE_PC_1
  ue_pc_address: 'PLKR-TP-UE04.intra.noklab.net'    # UE PC IP address
  ue_pc_login: 'user-lab0'
  ue_pc_password: 'Bts2003'
  ue_pc_port: '8080'

UE_POOLS:
    TafUeAndroidPool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE_1:
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'c4f200a6'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        << : *UE_PC_1
                        qualcomm_prototype: True
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: 1

