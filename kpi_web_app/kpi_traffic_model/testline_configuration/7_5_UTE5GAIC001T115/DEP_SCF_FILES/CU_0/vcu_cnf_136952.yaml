  # - Description: internal-e1 network configuration for cpnrt and cpif internal communication
  # --------------------------------------------------------------------------------------------------------------
  # | key                    | description                                                                       |
  # --------------------------------------------------------------------------------------------------------------
  # | vlName                 | VLAN interface name for which modification is not recommended                     |
  # --------------------------------------------------------------------------------------------------------------
  # | defaultUnderlyingIface | default underlying Ethernet interface for which modification is not recommended   |
  # --------------------------------------------------------------------------------------------------------------
  # | secUnderlyingIface     | secondary underlying Ethernet interface for which modification is not recommended |
  # --------------------------------------------------------------------------------------------------------------
  # | vid                    | VLAN ID of internale1, it's mandatory                                             |
  # --------------------------------------------------------------------------------------------------------------
  # | rangeStart             | start IP address in the IP range which can be IPv4 or IPv6                        |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                   |
  # |                        | it's mandatory                                                                    |
  # --------------------------------------------------------------------------------------------------------------
  # | rangeEnd               | end IP address in the IP range which can be IPv4 or IPv6                          |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                   |
  # |                        | it's mandatory                                                                    |
  # --------------------------------------------------------------------------------------------------------------
  # | subnet                 | the subnet of the network which can be IPv4 or IPv6                               |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0/24"), IPv6 FORMAT (e.g. "2001:db8::0/112")            |
  # |                        | it's mandatory                                                                    |
  # --------------------------------------------------------------------------------------------------------------
  # | role                   | IP role for the IP address                                                        |
  # --------------------------------------------------------------------------------------------------------------
  internalE1Network:
    internalE1:
      vlanInfo:
        vlName: "internale1"
        defaultUnderlyingIface: "e1"
        secUnderlyingIface: "e1s"
        vid: "121"
        mtu: 1500
      # - Description: define which group IP will be used when install the cnf
      # - Support value: "groupA","groupB"
      #                  "useGroup" set as "groupA" will only use the ipAddress under section "groupA"
      #                  "useGroup" set as "groupB" will only use the ipAddress under section "groupB"
      #                  if do Blue/Green upgrade, both of the ip addresses for "groupA" and "groupB" need to be configured
      # - Default value: "groupA"
      # - Note: "groupA" and "groupB" IP address should not be conflict, but need in the same subnet,
      #          reserved ip address count for cpif should be equal to "global.cpifInstance"
      # - Example: "global.cpifInstance" is 4, and useGroup is "groupA", the ip addresses 192.168.200.5-192.168.200.8 would be
      #             used for cpif instance, then "groupB" ipAddress should not be conflict with these IPs 192.168.200.4-192.168.200.8
      useGroup: "groupB"
      ipInfo:
      - subnet: "192.168.200.0/24"
        role:
        - "E1-C"
        ipAddress:
          groupA:
            cpif:
              rangeStart: "192.168.200.6"
              rangeEnd: "192.168.200.7"
            cpnrt:
              rangeStart: "192.168.200.4"
              rangeEnd: "192.168.200.5"
          # - recommend vlaues for groupB according current groupA default values
          # groupB:
          #   cpif:
          #      rangeStart: "192.168.200.11"
          #      rangeEnd: "192.168.200.11"
          #   cpnrt:
          #      rangeStart: "192.168.200.10"
          #      rangeEnd: "192.168.200.10"
          groupB:
            cpif:
              rangeStart: "192.168.200.8"
              rangeEnd: "192.168.200.9"
            cpnrt:
              rangeStart: "192.168.200.10"
              rangeEnd: "192.168.200.11"
      # - Description: this parameter is only for internale1 LRIP configuration
      # - Feature ID: CNI-74580
      # - Note: this gateway also should be configured on the switch
      lripInternalE1Info:
        gatewayList:
        - "192.168.200.1"

  # - Description: this is WA for adding seLinuxOptions into securityContext
  #   type:spc_t/level: s0
  #   true means WA is applied.SeLinux can be enforced and neither isolation/violation nor audit log is generated
  #   false means WA is removed and seLinux should be permissive or disabled. audit log can be found in case of permissive mode.
  seLinux: "true"
  # - Description: The collection of stack trace needs to be enabled as alternative for debugging program crashes only when core dump files are not achievable.
  # - Supported values: type string "true" or "false"
  # - Default value: "false"
  stackTraceEnabled: "false"


  # - Description: the storageclass name of persistent volume.
  # - Values:
  #     OCP multi-node, the storageClassName value should be "ocs-storagecluster-cephfs", and the accessModes value should be "ReadWriteMany"
  #     OCP single node, the storageClassName value should be "lvms-vg1", and the accessModes value should be "ReadWriteOnce"
  # - Note:
  #     The storageClassName in aic-vcu-prerequisite/values-override.yaml should be same value as this one.
  storageClassName: "ocs-storagecluster-cephfs"
  accessModes: "ReadWriteMany"

  # - Description: convention of name
  # - Note: The sum of all characters in the each prefix list should be less than 32 bytes.
  name_convention:
    pod_prefix:
    - "po"
    - "_NAMESPACE_"
    container_prefix:
    - "ctr"
    - "_NAMESPACE_"
    deployment_prefix:
    - "po"
    - "_NAMESPACE_"
    statefulset_prefix:
    - "po"
    - "_NAMESPACE_"
# - Description: sub chart certman-auto-cmp private configuration
certman-auto-cmp:
  configuration:
    # - Description: The CMP configuration
    cmp:
      # - Description: The secret name which defines the CMP server's pre-shared key, reference number
      cmp_secret_name: "secret788"
      # - Description: CMP server IP. Note: Mandatory for PnP
      ip: 10.96.129.254
      # - Description: CMP server port. Note: Mandatory for PnP
      port: 8080
      # - Description: CMP server URL path. Note: Mandatory for PnP
      path: pkix
      # - Description: CA subject name to be used in CMP initialization. Note: Mandatory for PnP
      ca_subject_name: CN=srnblrna1
      # - Description: EE certificate profile's certificate subject name. Note: Mandatory for PnP
      ee_subject_name: CN=MRBTS-136952
      # - Description: EE certificate profile's FQDN value to be set as subject alternative name
      ee_subject_fqdn: []
      # - Description: EE certificate profile's IP address to be set as subject alternative name
      ee_subject_ip_addr:
      - 10.110.177.206

      # - Description: additional TA (trust anchor) certificates secret name, if you created additional TA (trust anchor) certificates,
      #                you need to add the secrets name of the certificates here
    additionalTACertSecretName: []

