heat_template_version: 2016-10-14
description: 'Template to instantiate standalone management node instance'
parameters:
  vnf_name:
    type: string
    description: 5GBTS VNF name
    default: 5GBTS
    constraints:
      - length: {min: 1, max: 45}
        description: ( VNF NAME must be length <1-45>)
  cluster_id:
    type: string
    description: cluster identity
    default: "1"
    constraints:
      - length: {min: 1, max: 8}
        description: "Invalid cluster_id length (should be [1,8])"
  ha_cluster:
    type: comma_delimited_list
    description: HA nodes acting as etcd member instances and quorate voter
    default:
    - oam-000
  password:
    type: json
    description: password hash to use for RCP account
  user_info:
    type: json
    description: add user to client host
    default: {}
  extra_cloud_config_data:
    type: json
    default: {}
  run_command:
    type: comma_delimited_list
    description: command only runs during first boot
    default: []
  boot_command:
    type: comma_delimited_list
    description: command runs on every boot
    default: []
  config_external_ip:
    description: configure external ip and roles if set enabled
    type: string
    default: disabled
  network-interface-enable:
    description: indicate if external network interfaces should be activated or not after commission.
    type: boolean
    default: true
conditions:
  deploy_root_password:
    and:
      - not:
          equals:
          - get_param: [password, root]
          - ''
      - not:
          equals:
          - get_param: [password, root]
          - []
      - not:
          equals:
          - get_param: [password, root]
          - ~
      - not:
          equals:
          - get_param: [password, root]
          - null
      - not:
          equals:
          - get_param: [password, root]
          - {}
      - not:
          equals:
          - get_param: [password, root]
          -
  deploy_nokfsoperator_password:
    and:
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          - ''
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          - []
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          - ~
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          - null
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          - {}
      - not:
          equals:
          - get_param: [password, _nokfsoperator]
          -
resources:
  add_user:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        map_merge:
        - {get_param: extra_cloud_config_data}
        - {get_param: user_info}
  run_cmd:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        map_merge:
        - runcmd: {get_param: run_command}
        - bootcmd: {get_param: boot_command}

outputs:
  userdata:
    description: common cloud-init userdata parameters shared by all instances
    value:
      add_user: {get_resource: add_user}
      run_cmd: {get_resource: run_cmd}
      if:
      - and:
        - deploy_root_password
        - deploy_nokfsoperator_password
      - chpasswd:
          expire: false
          list:
          - str_replace:
              template: root:<hash$>
              params:
                <hash$>:
                  get_param: [password, root]
          - str_replace:
              template: _nokfsoperator:<$hash$>
              params:
                <$hash$>:
                  get_param: [password, _nokfsoperator]
      - if:
        - deploy_root_password
        - chpasswd:
            expire: false
            list:
            - str_replace:
                template: root:<hash$>
                params:
                  <hash$>:
                    get_param: [password, root]
        - if:
          - deploy_nokfsoperator_password
          - chpasswd:
              expire: false
              list:
              - str_replace:
                  template: _nokfsoperator:<$hash$>
                  params:
                    <$hash$>:
                      get_param: [password, _nokfsoperator]
          - {}
  metadata:
    description: common metadata parameters shared by all instances
    value:
      cluster-id:
        str_replace:
          template: $vnf-$cid
          params:
            $vnf: {get_param: vnf_name}
            $cid: {get_param: cluster_id}
      ha_db_backend: memory
      ha_db_memory_size: 256
      etcd-instances:
        repeat:
          for_each:
            <name>: {get_param: ha_cluster}
          template:
            str_replace:
              template: $vnf-$cid-<host>
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
                <host>: <name>
      quorate-monitor-voter-nodes:
        repeat:
          for_each:
            <name>: {get_param: ha_cluster}
          template:
            str_replace:
              template: $vnf-$cid-<host>
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
                <host>: <name>
      cloudplatform:
        if:
          - equals:
            - get_param: config_external_ip
            - enabled
          - NCIR
          - ~
      password:
        Nemuadmin: $5$rounds=10000$0rN1p3TN$0bzxA4T3uHMqbG0gX45amM18DMgG8ZTBSr/HOQdrLR6
        wsuser: $5$rounds=10000$6Kj3xARF$6D8XNkLOFxc8yswG4hhvCXyCdHau5WY6yxH/ZxRrle8
        serviceuser: $5$rounds=10000$OpZaSSI2$z0XJGwQ10Qs5kaeDqaooM0P2Z/9dYspyBzwIWWbVei4
      network-interface-enable: {get_param: network-interface-enable}
