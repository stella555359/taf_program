UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    # processes_to_kill: # processes to kill on UE PC - anything that may interrupt a test case
                    #   - 'notepad++'
                    #   - 'putty'
                    #   - 'QXDM'
                    #   - 'adb'
                    #   - 'iperf'
                    #   - 'QPSTConfig'
                    #   - 'QMITestPro'
                    #   - 'uemanager'
                    com_port: '11'       # number of com port supporting AT commands
                    configuration:
                        ue_pc_address: 'plkr-tp-ue46.intra.noklab.net'        # UE PC domain address or IP
                        # 'plkr-sg07-12.intra.noklab.net' raw adres equals '10.84.182.249'
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        # ue_pc_port: 80                                        # OPTIONAL, default is 80
                        proxy_mngr_port: 9955           # ueproxy manager will not be visible unless proxy_mngr_port is configured! (default value: 9955 - used in autostart)
                        ue_pc_expected_prompt: 'pzkrk@PLKR-TP-UE46'           # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-TP-UE46'
                        data_transfer:                                        # Data Transfer Protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                version: '3'
                                interface_name: 'Cellular 3'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1

