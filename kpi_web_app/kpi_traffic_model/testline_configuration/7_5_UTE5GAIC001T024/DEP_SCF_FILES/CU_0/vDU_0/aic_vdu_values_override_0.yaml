trsconfig:
  # - Description: the uid and gid to start trsconfig container
  securityContext:
    uid: *uid
    gid: *gid
  # - Description: node seletor to deploy trsconfig for C-RAN deployment.
  # - Note: the value is key-value nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

# - Description: sub chart kubeapisymptomdataprovider private configuration
kubeapisymptomdataprovider:
  podSecurityContext:
    fsGroup: *groups
  securityContext:
    runAsGroup: *gid
    runAsUser: *uid
  # - Description: node seletor to deploy kubeapisymptomdataprovider for C-RAN deployment.
  # - Note: the value is key-value nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

# ========configuration oamfh POD =========
aic-oamfh:
  # ======== configuration OAM POD support C-RAN deploy =========
  # - Description: node seletor to deploy oam pod for C-RAN deployment.
  # - Note: oam is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

  # ======== configuration OAM POD security context =========
  # - Description: define the uid for runAsUser, the gid for runAsGroup and the groups for fsGroup to start the containers in oam pods
  securityContext:
    # Define the uid and gid for pod, uid/gid with non zero the container start with
    # non-root user, if the uid/gid is zero will start with root user.
    runAsUser: *uid
    runAsGroup: *gid
    # Define the group of mounted volumes for pod, containers started with non-root
    # need to make sure their gid can access expected volume.
    fsGroup: *groups

  # - Description: the directory for hostpath volume to storage the coredump info
  # - Note: the volume will not create if the value is blank.
  coredumppath: *coredumppath

  # ========configuration about dhcp container ========
  dhcp:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid
    service:
      # Indicate internal or external dhcp server to be used, the default value is internal
      dhcpServerLocation: "internal"
      # v4PoolsStart and v4PoolsEnd define the actual part of your subnet that is governed
      v4PoolsStart: 192.168.254.34
      v4PoolsEnd: 192.168.254.60
      # v4Subnet define the whole subnet.
      v4Subnet: 192.168.254.0/26

      # DHCP vendor specific information of master agent ip and port number
      option43_vendor_specific_information_master_agent_ip: "192.168.254.33"
      option43_vendor_specific_information_port_number: "13001"

      #<Product code>/<Serial number> in option 61 client identifier
      #clientIdentifier is configuerd as a list of product code/serial number of RUs.
      #It is an optional parameter. DHCP option 61 will not be checked by DHCP server,
      #if clientIdentifier is empty. For example:
      #     clientIdentifier:
      #     - "753/001"
      #     - "753/002"
      #     - "753/003"
      #     - "755/001"
      #     - "755/002"
      clientIdentifier:

  # ========configuration about vsftp ========
  vsftp:
    securityContext:
      # set default user and group
      runAsUser: *uid
      runAsGroup: *gid

aic-oamext:
  # ======== configuration OAM POD support C-RAN deploy =========
  # - Description: node seletor to deploy oam pod for C-RAN deployment.
  # - Note: oam is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

  # ======== configuration OAM POD security context =========
  # - Description: define the uid for runAsUser, the gid for runAsGroup and the groups for fsGroup to start the containers in oam pods
  securityContext:
    # Define the uid and gid for pod, uid/gid with non zero the container start with
    # non-root user, if the uid/gid is zero will start with root user.
    runAsUser: *uid
    runAsGroup: *gid
    # Define the group of mounted volumes for pod, containers started with non-root
    # need to make sure their gid can access expected volume.
    fsGroup: *groups

  # - Description: the directory for hostpath volume to storage the coredump info
  # - Note: the volume will not create if the value is blank.
  coredumppath: *coredumppath

  # ====== configuration running in nwmgmt conatiner=====
  nwmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about nftmgmt ========
  nftmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about APIGW ========
  apigw:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about HTTPD ========
  httpd:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about providercontroller ========
  providercontroller:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about vaultapp, including appsecretinit&stunnel&credmediator ========
  vaultapp:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # - Description: sub chart certificate-management private configuration
  certman:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # - Description: sub chart ipsecmgmt private configuration
  ipsecmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # - Description: sub chart givaxi private configuration
  givaxi:
    securityContext:
