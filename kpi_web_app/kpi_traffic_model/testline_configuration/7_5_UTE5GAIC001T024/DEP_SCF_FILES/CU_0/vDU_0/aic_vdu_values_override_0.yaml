# ======== configuration UP POD =========
aic-vdu-up:
  # ======== configuration UP POD support C-RAN deploy =========
  # - Description: the number of up POD to deploy.
  # - Note: for D-RAN only on single node server, the value is number 1 for up pod by default
  #         for C-RAN support deploy on multi-node server, the minimum value is 2, depend on the number of worker nodes
  replicaCount: 1
  # - Description: node seletor to deploy up pod for C-RAN deployment.
  # - Note: up is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: WorkerBM
  nodeSelector: {}
  # bipPdumpLogging storage configuration
  bipPdumpLogging:
    persistentVolumeClaim:
      # 10Gi per container per pod
      size: "10"
      storageClassName: *sc

  # ======== configuration UP POD security context =========
  # - Description: define the uid for runAsUser, the gid for runAsGroup and the groups for fsGroup to start the containers in up pods
  securityContext:
    # Define the uid and gid for pod, uid/gid with non zero the container start with
    # non-root user, if the uid/gid is zero will start with root user.
    runAsUser: *uid
    runAsGroup: *gid
    # Define the group of mounted volumes for pod, containers started with non-root
    # need to make sure their gid can access expected volume.
    fsGroup: *groups

  # - Description: the directory for hostpath volume to storage the coredump info
  # - Note: the volume will not create if the value is blank.
  coredumppath: *coredumppath
  # - Description: add "cellFlag" and "activeSiblingCore" to support the different cpu configuration
  #   "cellFlag" support Values: multi, two, single. "activeSiblingCore" support Values: true, false
  #   Refer to detailed comments below in l1hi/l2hi/l2rt container
  cellFlag: &cellFlag "multi"
  activeSiblingCore: &activeSiblingCore "true"

  # ====== configuration about l1hi container =====
  l1hi:
    securityContext:
      # Description: the flag that indicate if l1hi run with privileged permission. Support Values: true, false.
      # Default: "false"
      privilegedMode: "false"
      # if run as non-privilege, user/group must set as non-root
      runAsUser: *uid
      runAsGroup: *gid
    # WA for PR541790: "TRUE" for enable, "FALSE" for disable
    FHP_PRACH_RECEIVE_WIN_WORKAROUND_ENABLE: "FALSE"

    # FHP static L3 call and dynamic call compactible solution
    fhpconfig:
      # - Description: FHP_HOST_VLAN_ENABLE, default FALSE in FHP code, miss this value FHP will act as guest vLAN.
      # - Note: it is forbidden to change.
      # -       after guest VLAN enable, remove this value or change to FALSE
      FHP_HOST_VLAN_ENABLE: "FALSE"

    # - Description:Enable or disable fast cplane feature
    # - Note: RCP2029 enable or not. Available value is 'TRUE' or 'FALSE'.
    #         FALSE means disable RCP2029 feature as default.
    #         TRUE means enable RCP2029 feature.
    #         This functions should be enabled together on FHGW and vDU side, if FHGW hasn't included this function, this value
    #         should be set to FALSE on VDU side, or this value should be set to TRUE.
    fast_cplane_enabled: "TRUE"

    # FDD SCS is 15K, TDD SCS is 30k, to avoid SCS change after l1-container startup, operator need configure correct value for UP pod.
    # Introduce env variable to set initial SCS value for FHP and L1-Hi during startup(workaround for  CB007289 integration):
    #     1. L1_DEFAULT_SCS: miss this value , FHP set 15K as default SCS.
    #     2. L1_DEFAULT_SCS: 30, set 30k as default SCS.
    #     3. L1_DEFAULT_SCS: if it is not 30, set 15k as default SCS.
    l1_default_scs: "30"

    # - Description: the different cpu configuration of l1hi container to deploy on different HW/CloudPlatform/Testing purpose
    # Users only set activeSiblingCore and cellFlag value, and container will deploy with dedicatedNum.
    # --------------------------------------------------------------------------------------------
    # | platform   activeSiblingCore    cellFlag        container dedicatedNum                   |
    # |   NCS         false              single    5(l1 apps) + 1(fh-proxy+fh-io)=6              |
    # |   NCS         false              multi     8(l1 apps) + 4(fh-proxy+fh-io)=12             |
    # |   OCP         true               single    10(l1 apps) + 2(fh-proxy+fh-io) + 2(CCSRT)=14 |
    # |   OCP         true               two       10(l1 apps) + 4(fh-proxy+fh-io) + 2(CCSRT)=16 |
    # |   OCP         true               multi     16(l1 apps) + 8(fh-proxy+fh-io) + 2(CCSRT)=26 |
    # |   OCP         false              single    5(l1 apps) + 1(fh-proxy+fh-io) + 1(CCSRT)=7   |
    # |   OCP         false              two       5(l1 apps) + 2(fh-proxy+fh-io) + 1(CCSRT)=8   |
    # |   OCP         false              multi     8(l1 apps) + 4(fh-proxy+fh-io) + 1(CCSRT)=13  |
    # --------------------------------------------------------------------------------------------
    # note: containers will deploy failure if config incorrectly.
    # default: activeSiblingCore set "true" and cellFlag set "multi" by customer scenario, others is for internal test.
    cellFlag: *cellFlag
    activeSiblingCore: *activeSiblingCore
    dptrace:
      # - Description: Enable or disable l1 container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l1 container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l1 container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

  # ====== configuration about l2hi container =====
  l2hi:
    # - Description: the different cpu configuration of l2hi container to deploy on different HW/CloudPlatform/Testing purpose
    # Users only set activeSiblingCore and cellFlag value, and container will deploy with dedicatedNum.
    # ---------------------------------------------------------------------------------------
    # | platform   activeSiblingCore    cellFlag            dedicatedNum                    |
    # |   NCS        false              single         1(l2hi apps+trsw)=1                  |
    # |   NCS        false              multi          3(l2hi apps) + 2(trsw)=5             |
    # |   OCP        true               single         2(l2hi apps + trsw) + 2(CCSRT)=4     |
    # |   OCP        true               two            2(l2hi apps + trsw) + 2(CCSRT)=4     |
    # |   OCP        true               multi          6(l2hi apps) + 4(trsw) + 2(CCSRT)=12 |
    # |   OCP        false              single         1(l2hi apps + trsw) + 1(CCSRT)=2     |
    # |   OCP        false              two            1(l2hi apps + trsw) + 1(CCSRT)=2     |
    # |   OCP        false              multi          3(l2hi apps) + 2(trsw) + 1(CCSRT)=6  |
    # ---------------------------------------------------------------------------------------
    # note: containers will deploy failure if config incorrectly.
    # default: activeSiblingCore set "true" and cellFlag set "multi" by customer scenario, others is for internal test.
    cellFlag: *cellFlag
    activeSiblingCore: *activeSiblingCore
    securityContext:
      # Description: the flag that indicate if l2hi run with privileged permission. Support Values: true, false.
      # Default: "false"
      # Note: WA for run on RH-OCP version lower than 4.9, l2hi can only run under privilgedMode as true
      privilegedMode: "true"
      # if run as non-privilege, user/group must set as non-root
      runAsUser: *uid
      runAsGroup: *gid
    dptrace:
      # - Description: Enable or disable l2hi container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2hi container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2hi container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

  # ====== configuration about l2rt container =====
  l2rt:
    # - Description: the different cpu configuration of l2rt container to deploy on different HW/CloudPlatform/Testing purpose
    # Users only set activeSiblingCore and cellFlag value, and container will deploy with dedicatedNum.
    # +----------+-------------------+------------------+---------------------------------+
    # | platform | activeSiblingCore |     cellFlag     |           dedicatedNum          |
    # +----------+-------------------+------------------+---------------------------------+
    # |   NCS    |       false       |   single/multi   |       3(L2PS) + 2(L2Lo)=5       |
    # |   OCP    |        true       | single/two/multi | 6(L2PS) + 4(L2Lo) + 2(CCSRT)=12 |
    # |   OCP    |       false       | single/two/multi |  3(L2PS) + 2(L2Lo) + 1(CCSRT)=6 |
    # +----------+-------------------+------------------+---------------------------------+
    # note: containers will deploy failure if config incorrectly.
    # default: activeSiblingCore set "true" and cellFlag set "multi" by customer scenario, others is for internal test.
    cellFlag: *cellFlag
    activeSiblingCore: *activeSiblingCore
    dptrace:
      # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

  # ====== configuration running in nwmgmt conatiner=====
  nwmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # ========configuration about nftmgmt ========
  nftmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

  # - Description: sub chart ipsecmgmt private configuration
  ipsecmgmt:
    securityContext:
      runAsUser: *uid
      runAsGroup: *gid

# - Description: securityContext parameters used in SWM hook
# - NOTE: SWM securityContext will align with OAM securityContext
swm:
  # gid: this value should belong to the the same fsGroup secondary group defined for the OAM Pod
  # if OAM pod doesn't specify the fsgroup id, then this value should same OAM pod gid.
  securityContext:
    runAsGroup: *gid
    runAsUser: *uid
