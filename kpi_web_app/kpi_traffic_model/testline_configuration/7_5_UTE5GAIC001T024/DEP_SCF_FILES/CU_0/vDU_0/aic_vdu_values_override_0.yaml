# - Override values for deployment in cloud-development enviromnent
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

# - Description: securiryContext configuration for vDU uid/gid/groups
securityContext:
  uid: &uid 9999
  gid: &gid 9999
  groups: &groups 9999

# - Description: the directory for hostpath volume to storage the coredump info
# - Note: the default value of coredumpPath is set to "", means coredump will not be saved
# -       this config is for internal trouble shooting if set to host path
# -       example: coredumpPath: &coredumppath "/tmp/cdump"
coredumpPath: &coredumppath "/tmp/cdump"

global:

  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: device Pool List
  # - Note: need to be filled accoring to the real environment!!!
  devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_ens93f2"
    # The SR-IOV Device Pool used by oam/tracing/f1c/fhm networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_ens93f2"
    # The SR-IOV Device Pool used by fhuc networks (fast path)
    fastPathFhPool: "openshift.io/sriov_vfio_ens93f2"
    # The SR-IOV Device Pool used by fhm networks (slow path)
    slowPathFhPool: "openshift.io/sriov_netdevice_ens93f2"

  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/family/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - all ip address support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam & tracing
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vid: 1216
      ipInfo:
      - rangeStart: "10.108.205.66"
        rangeEnd: "10.108.205.66"
        subnet: "10.108.205.64/29"
        family: "IPv4"
        type: "physical"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.108.205.65"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    tracing:
      vlanInfo:
        vid: 1214
      ipInfo:
      - rangeStart: "10.108.205.50"
        rangeEnd: "10.108.205.50"
        subnet: "10.108.205.48/29"
        family: "IPv4"
        type: "physical"
        role:
        - "Tracing"

    f1c:
      vlanInfo:
        vid: 1215
      ipInfo:
      - rangeStart: "10.108.205.58"
        rangeEnd: "10.108.205.58"
        subnet: "10.108.205.56/29"
        family: "IPv4"
        type: "physical"
        role:
        - "F1-C"
    fhm:
      vlanInfo:
        vid: 295
        pcp: ""
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        family: "IPv4"
        type: "physical"
        role:
        - "fhm"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        vid: 1215
      ipInfo:
      - rangeStart: "10.108.205.59"
        rangeEnd: "10.108.205.59"
        subnet: "10.108.205.56/29"
        family: "IPv4"
        type: "physical"
        role:
        - "Tracing"
        - "F1-U"
    # f1 RAN sharing for additonal operator1, only avaiable if RAN sharing function enabled
    f1_op1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane1"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_OP_1"
    # f1 RAN sharing for additonal operator2, only avaiable if RAN sharing function enabled
    f1_op2:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane2"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_OP_2"
    # f1 RAN sharing for additonal operator3, only avaiable if RAN sharing function enabled
    f1_op3:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane3"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_OP_3"
    # f1 RAN sharing for additonal operator4, only avaiable if RAN sharing function enabled
    f1_op4:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane4"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_OP_4"
    # f1 RAN sharing for additonal operator5, only avaiable if RAN sharing function enabled
    f1_op5:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane5"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_OP_5"
    #  - Description: Network slice for F1-U,here just list one example for one slice
    #    Add one network slice for F1-U according to following instruction.
    #      1. copy the whole section from "f1u_slice1" to "- 'F1-U_slice1'" including all the spaces
    #      2. paste the whole section after line "- 'F1-U_slice1'"
    #      3. modify the section key name "f1_slice1", align with the new vlName and role
    #      4. configure vid( vlan id), rangeStart,rangeEnd,subnet,family
    #  - Feautre ID: CB008473
    #  - Note:
    #    vlName should be unique and can be defined by user, please not exceed 16 characters
    #    role should be unique and format like "F1-U_X"
    #    X is the dynamic part which can be customized by operator. The maximum length for X is 24 and the allowed characters can include [A-Za-z0-9]
    f1_slice1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1u_slice1"
        defaultUnderlyingIface: "f1"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        family: ""
        type: "physical"
        role:
        - "F1-U_slice1"
    # - End example for network slice
    fhuc1:
      vlanInfo:
        vid: 301
        pcp: ""
    fhuc2:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc3:
      vlanInfo:
        vid: ""
        pcp: ""
    fhuc4:
      vlanInfo:
        vid: ""
        pcp: ""
    fhuc5:
      vlanInfo:
        vid: ""
        pcp: ""
    fhuc6:
      vlanInfo:
        vid: ""
        pcp: ""
    l1bipl1:
      vlanInfo:
        vid: 1212
    l1biprt:
      vlanInfo:
        vid: 1212
    l2biprt:
      vlanInfo:
        vid: 1213
    l2biphi:
      vlanInfo:
        vid: 1213

  # - Description: network attribute definition for each network.
  #   This section is provide to set the MTU for each network
  networkInfo:
    fhm:
      mtu: 1500
    tracing:
      mtu: 1500
    oam:
      mtu: 1500
    f1c:
      mtu: 1500
    bip:
      mtu: 9000
    fhuc:
      mtu: 1500
    f1:
      mtu: 1500

  fecDevicePool:
    # - Description: it is used for accelerated card supporting. the values are supported as following,
    #   - For NCS supporting Mt. Bryce card: "nokia.k8s.io/sriov_fec"
    #   - For OCP OE20 FP2 supporting Mt. Bryce card: "intel.com/intel_fec_acc100"
    # - Default value: "intel.com/intel_fec_acc100"
    fecVF: "intel.com/intel_fec_acc100"
    # - Description: fecVFNum is that number of virtual function.
    # - Note: When you want to active the HW FEC, this value should be set to 1
    # - Default value: "1"
    fecVFNum: "1"
  # - Description: CPU management method. The Value is "cpuManager" and "cpuPooler".
  # - Default value: "cpuManager"
  cpuDevicePlugin: "cpuManager"
  # - Description: cpuDevicePool is introduced for distinguish different cpu device pool namings.
  #   For cpuDevicePool, the values are supported as following,
  #   - For NCS cpuPooler:
  #       - sharedCore Naming:"nokia.k8s.io/shared_pool"
  #       - dedicatedCore Naming:"nokia.k8s.io/exclusive_numa_0_pool"
  #   - For OCP cpuManager:
  #       - sharedCore Naming: "cpu"
  #       - dedicatedCore Naming: "cpu"
  cpuDevicePool:
    sharedCore: "cpu"
    dedicatedCore: "cpu"
  # - Description: the storageclass configuration of persistent volume
  storageClass:
    # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
    # - Values:
    # -   NCS multi node: csi-cephfs
    # -   NCS single node: dynamic-local-storage
    # -   OCP multi node: ocs-storagecluster-cephfs
    # -   OCP single node: localfs-lvm-sc
    storageClassName: &sc ""

  # - Description: convention of name
  name_convention:

    pod_prefix:
    - po
    - _NAMESPACE_

    container_prefix:
    - ctr
    - _NAMESPACE_

    deployment_prefix:
    - po
    - _NAMESPACE_

    statefulset_prefix:
    - po
    - _NAMESPACE_

  # - Description: registry of image
  # - NCS: bcmt-registry:5000/dep align with images.properties.NCS in onBoradignApp
  # - OCP: image-registry.openshift-image-registry.svc:5000/<namespace> align with images.properties.OCP in onBoradignApp
  image:
    registry: "image-registry.openshift-image-registry.svc:5000/cran1"

  # - Description: time zone in format "Region/City", e.g. "Asia/Shanghai". Defuault as 'UTC'.
  timezone: "Asia/Shanghai"

  #########################################################
  # global configuration for VDU parent chart
  #########################################################

  # - Description: the name of persistent volume
  # - Note: Ensure uniqueness for every VDU and keep same when do upgrade/update
  # -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
  pvcName: "vdupvc"
  # - Description: the flag that indicate if fastpath interfaces are bind on Host or not. Support Values: true, false.
  # - Default value: true
  fpIfaceBindOnHost: "true"

  # Custom extensions for labels which will be injected into ConfigMap,
  # Service, Pod resources.
  # Example:
  #  labels: {nf-type: 5g-nf-producer}
  custom_extensions:
    labels: {}

  # - Description: deployment type to indicate which type of cloud hardware usage.
  # - Support Values: OE20_MEDIUM_CAP, OE19_MEDIUM_CAP, OE20, OE19.
  # - Notice: Notice: The resource consumption of OE20_MEDIUM_CAP and OE20 are the same. The resource consumption of OE19_MEDIUM_CAP and OE19 are the same.
  # - Default value: "OE20_MEDIUM_CAP"
  deploymentType: "OE20"

  # - Description: Description of a site used as auto connection site ID.
  # - Note: As it will be used for identifying the vDU, ensure uniqueness for every vDU
  # -       equal to the value of MRBTS/AutoConnSiteID parameter from the CM plan imported to the NMS
  # -       1 to 50 ASCII characters
  siteDescription: "MRBTS-1234"

  # - Description: URL (containing IP address) of the NMS
  urlNMS: ""

  # - Description: external IP to access ne3sagent, used by NMS to connect back (register)  with ne3sagent
  # - Note: current agentIP should be the same as vDU oam IP by default, due to ne3sagent run in oam container
  agentIP: ""

  # - If there's only valid input in cmp_secret_name, an external secret is expected.
  # - If there's valid input in cmp_secret_name, cmp_psk and cmp_refnum, the secret would be created within helm chart.
  # - Description: The secret name which defines the CMP server's pre-shared key, reference number
  cmp_secret_name: &cmpSecretName ""
  # - Description: CMP server's pre-shared key
  cmp_psk: ""
  # - Description: CMP server's reference number
  cmp_refnum: ""

  # - Description: psk for vault application access
  psk:
    default_read_cert:     "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    default_write_cert:    "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    certificatemanagement: "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    ipsec_write:           "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    oamextipsecread:       "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    cprtipsecread:         "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"
    upipsecread:           "4ReY6MQRFhxZuQGkeuoQqEqEp95gKj9m"

  # - Description: IPv6 UDP packets with zero checksum is valid for ingress traffic. Support Values: enabled (packets with zero checksum is valid), disabled (packets with zero checksum is invalid).
  # - Default value: enabled
  ipv6RxUdpZeroChecksum: "enabled"

  # - Description: Fill udp checksum with zero (enabled) or generate udp checksum (disabled) for IPv6 egress traffic. Support Values: enabled, disabled.
  # - Default value: disabled
  ipv6TxUdpZeroChecksum: "disabled"

  # - Description: true means SeLinux enforcing + WA, not support audit log; false means seLinux permissive + no WA, support audit log.
  # - Default value: true
  seLinux: "true"

  # - Description: the name of RuntimeClass which is used for high performance
  # - Default value: "nokia-performance"
  highPerformanceRunTimeClass: "nokia-performance"

#########################################################
# top level configuration private to RCP sub charts
#########################################################

# - Description: sub chart certman-auto-cmp private configuration
certman-auto-cmp:
  configuration:
    # - Description: The CMP configuration
    cmp:
      # - Description: The secret name which defines the CMP server's pre-shared key, reference number
      cmp_secret_name: *cmpSecretName
      # - Description: CMP server IP. Note: Mandatory for PnP
      ip:
      # - Description: CMP server port. Note: Mandatory for PnP
      port:
      # - Description: CMP server URL path. Note: Mandatory for PnP
      path:
      # - Description: CA subject name to be used in CMP initialization. Note: Mandatory for PnP
      ca_subject_name:
      # - Description: EE certificate profile's certificate subject name. Note: Mandatory for PnP
      ee_subject_name:
      # - Description: EE certificate profile's FQDN value to be set as subject alternative name
      ee_subject_fqdn: []
      # - Description: EE certificate profile's IP address to be set as subject alternative name
      ee_subject_ip_addr: []
  # - Description: the uid and gid to start certman-auto-cmp container
  securityContext:
    runAsUser: *uid
    runAsGroup: *gid
  # - Description: node seletor to deploy certman-auto-cmp pod for C-RAN deployment.
  # - Note: the value is key-value nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

# - Description: sub chart pm private configuration
pm:
  # - Description: the uid and gid to start PM container
  securityContext:
    uid: *uid
    gid: *gid
  # - Description: node seletor to deploy pm pod for C-RAN deployment.
  # - Note: the value is key-value nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

# - Description: sub chart rcpfm private configuration
rcpfm:
