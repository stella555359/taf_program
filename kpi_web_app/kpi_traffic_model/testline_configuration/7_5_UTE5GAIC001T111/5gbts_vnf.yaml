  db_node:
    condition: deploy_basic_condition
    depends_on: [oam_node, upue_nodes]
    type: 5GBTS::Node::Common
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm-$idx
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: {get_param: [vnfc_type_name_map, {get_param: [cbam, extensions, vnfc_type_name_case]}, db]}
            $idx: "000"
      roles: [application, 5gbts_common_pre, 5gbts_db]
      instance_params: {get_param: [cbam, resources, db_node]}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, db_0]}
