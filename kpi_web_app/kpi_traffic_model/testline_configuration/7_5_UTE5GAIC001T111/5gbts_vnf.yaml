outputs:
  management_ip:
    description: Primary management IP address allocated to access the system
    value:
      if:
        - deploy_basic_condition
        - get_param: [cbam, extensions, oam_ip_0]
        - get_param: [cbam, extensions, oam_ip_logical]

  management_ips:
    description: All management IP address allocated to access the system
    value:
      if:
        - deploy_basic_condition
        - ip_address: {get_param: [cbam, extensions, oam_ip_0]}
        - - ip_address: {get_param: [cbam, extensions, oam_ip_0]}
          - ip_address: {get_param: [cbam, extensions, oam_ip_1]}
          - ip_address: {get_param: [cbam, extensions, oam_ip_logical]}