heat_template_version: 2016-10-14

description: Template for create all VNFCs

parameters:
  cloudplatform:
    description: cloud platform
    type: string
    default: "osp"
  cbam:
    type: json
  vnfc_type_name_map:
    description: vnfc name map
    type: json
    default:
      lower:
        oam: oam
        cpcn: cpcn
        cpue: cpue
        upue: upue
        cpif: cpif
        cpnb: cpnb
        cpcl: cpcl
        cpnrt: cpnrt
        uvm: uvm
        db: db
      upper:
        oam: OAM
        cpcn: CPCN
        cpue: CPUE
        upue: UPUE
        cpif: CPIF
        cpnb: CPNB
        cpcl: CPCL
        cpnrt: CPNRT
        uvm: UVM
        db: DB
  int_port_type:
    description: internals port type
    type: string
    default: virtio
    constraints:
      - allowed_values: [virtio]
  ext_port_type:
    description: external port type
    type: string
    default: sriov
    constraints:
      - allowed_values: [sriov]
  oam_port_type:
    description: oam port type
    type: string
    default: virtio
    constraints:
      - allowed_values: [virtio]
  config_drive:
    description: Use config drive instead of metadata server
    type: boolean
    default: true
  enable_sriov:
    description: flag of enable sriov vlan tag function
    type: boolean
    default: true
  enable_internal_dhcp:
    type: boolean
    description: Enable internal network dhcp
    default: False
  lvm_gfs_nodes:
    type: json
    description: LVM GlusterFS server hostnames
    default:
      lower: [oam-000, oam-001, cpif-000]
      upper: [OAM-000, OAM-001, CPIF-000]
    hidden: true
    immutable: true

conditions:
  deploy_basic_condition: {equals: [{get_param: [cbam, extensions, vnf_layout]}, "basic"]}
  deploy_redundant_condition: {equals: [{get_param: [cbam, extensions, vnf_layout]}, "redundant"]}

resources:
  nuage_enabled:
    type: OS::Heat::Value
    properties:
      type: boolean
      value:
        if:
        - or:
          - equals:
            - {get_param: [cbam, extensions, ext_port, nuage_netpartition_name]}
            - ''
          - equals:
            - {get_param: [cbam, extensions, ext_port, nuage_netpartition_name]}
            - null
        - False
        - True
  cpue_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, cpue_nodes, count]}
        - {get_param: [cbam, resources, cpue_nodes_redundant, count]}

  upue_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, upue_nodes, count]}
        - {get_param: [cbam, resources, upue_nodes_redundant, count]}

  upgrade_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, upgrade_node, count]}
        - {get_param: [cbam, resources, upgrade_node_redundant, count]}

  common_available_zones:
    type: 5GBTS::Common::AvailableZones
    properties:
      availability_zones: {get_param: [cbam, extensions, availability_zones]}
      number_of_cpue_nodes: {get_attr: [cpue_count, value]}
      number_of_upue_nodes: {get_attr: [upue_count, value]}

  common_params:
    type: 5GBTS::Common::Parameters
    properties:
      vnf_name: {get_param: [cbam, extensions, vnf_name]}
      cluster_id: {get_param: [cbam, extensions, cluster_id]}
      vnf_layout: {get_param: [cbam, extensions, vnf_layout]}
      vnfc_type_name_case: {get_param: [cbam, extensions, vnfc_type_name_case]}
      round_check_sid: {get_param: [cbam, extensions, ext_port, round_check_sid]}
      cleartextpassword: {get_param: [cbam, extensions, cleartextpassword]}
      password: {get_param: [cbam, extensions, password]}
      network-interface-enable: {get_param: [cbam, extensions, network-interface-enable]}

  keypair:
    type: OS::Nova::KeyPair
    properties:
      name:
        str_replace:
          template: $vnf-$cid-generated
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      public_key: {get_param: [cbam, publicSshKey]}

  oam_cpif_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-oam-cpif-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - anti-affinity

  network_setup:
    type: 5GBTS::Network::Setup
    properties:
      oam_network: {get_param: [cbam, extensions, oam_network]}
      external_networks:
        extnet_a: {get_param: [cbam, extensions, external_networks, extnet_a]}
        extnet_b: {get_param: [cbam, extensions, external_networks, extnet_b]}
      ext_port_vlans: {get_param: [cbam, extensions, ext_port]}
      internal_network: {get_param: [cbam, extensions, internal_network]}
      internal_srv_network: {get_param: [cbam, extensions, internal_srv_network]}
      internal_e1_network: {get_param: [cbam, extensions, internal_e1_network]}
      internal_networks: {get_param: [cbam, extensions, internal_networks]}
      nuage: {get_param: [cbam, extensions, nuage]}
      enable_internal_dhcp: {get_param: enable_internal_dhcp}
      name_prefix:
        str_replace:
          template: $vnf-$cid
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}

  oam_node:
    type: 5GBTS::Node::Oam
    condition: deploy_basic_condition
    depends_on: network_setup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm-$idx
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: {get_param: [vnfc_type_name_map, {get_param: [cbam, extensions, vnfc_type_name_case]}, oam]}
            $idx: "000"
      roles: [management, external-connectivity, 5gbts_oam]
      instance_params: {get_param: [cbam, resources, oam_node]}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, oam_0]}
      key_name: {get_resource: keypair}
      number_of_nodes_basic:
        deployment:
          number_of_cpcl: 1
          number_of_cpue: {get_attr: [cpue_count, value]}
          number_of_upue: {get_attr: [upue_count, value]}
          min_number_of_cpcl: 1
          min_number_of_cpue: 1
          min_number_of_upue: 1
          max_number_of_cpcl: 1
          max_number_of_cpue: 10
          max_number_of_upue: 36
      oam_net_0:
        name: oam
        uuid: {get_attr: [network_setup, networks, oam]}
        ip_address: {get_param: [cbam, extensions, oam_ip_0]}
        port_type: {get_param: oam_port_type}
        mtu: {get_param: [cbam, extensions, oam_port_mtu]}
        pmtu: {get_param: [cbam, extensions, oam_pmtu]}
      internal_networks:
        count: 2
        net_list:
        - name: internal
          uuid: {get_attr: [network_setup, networks, internal]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
        - name: internal_srv
          uuid: {get_attr: [network_setup, networks, internal_srv]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal_srv, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
      external_networks:
        count: 2
        net_list:
        - name: sriov_a
          uuid: {get_attr: [network_setup, networks, extnet_a]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
        - name: sriov_b
          uuid: {get_attr: [network_setup, networks, extnet_b]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
      lrvl_information:
        count: 1
        net_list:
        - name: f1om
          sid: {get_attr: [network_setup, networks, f1om_sid]}
          ip: {get_attr: [network_setup, networks, f1om_ip_oam_0]}
          role: {get_attr: [network_setup, networks, f1om_role_oam_0]}
      ntp_servers: {get_param: [cbam, extensions,ntp_servers]}
      cluster_id:
        str_replace:
          template: $vnf-$cid
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      timezone: {get_param: [cbam, extensions, timezone]}
      dns_forwarders: {get_param: [cbam, extensions, dns_forwarders]}
      dpdk_type: none
      cinder_volumes:
        count: 1
        vol_list:
        - size: 26
          name: &oam_vol_name
            str_replace:
              template: $vnf-$cid-oam-vol
              params:
                $vnf: {get_param: [cbam, extensions, vnf_name]}
                $cid: {get_param: [cbam, extensions, cluster_id]}
      lvm_local_volumes:
        count: 1
        vol_list:
        - {size: 2500M, name: dbcm, mount: /mnt/dbcm, volume: *oam_vol_name}
      lvm_nfs_volumes:
        count: 5
        vol_list:
        - {size: 10000M, name: ccs, mount: /mnt/ccs, volume: *oam_vol_name}
        - {size: 500M, name: mstate, mount: /mnt/mstate, volume: *oam_vol_name}
        - {size: 5000M, name: export, mount: /mnt/export, volume: *oam_vol_name}
        - {size: 1000M, name: log, mount: /mnt/log, volume: *oam_vol_name}
        - {size: 2000M, name: services, mount: /mnt/services, volume: *oam_vol_name}
      extra_cloud_config_data: {get_param: [cbam, extensions, extra_cloud_config_data]}
      config_drive: {get_param: config_drive}
      enable_sriov: {get_param: enable_sriov}
      cloudplatform: {get_param: cloudplatform}
      enable_internal_dhcp: {get_param: enable_internal_dhcp}
      oam_default_gw: {get_param: [cbam, extensions, oam_default_gw]}
      oam_security_group: {get_param: [cbam, extensions, oam_security_group]}
      user_data:
        get_attr: [common_params, user_data]
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata_general]
        - get_attr: [common_params, metadata_sriov]

  oam_node_in_redundant:
    type: 5GBTS::Node::Oam::In::Redundant
    condition: deploy_redundant_condition
    depends_on: network_setup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: {get_param: [vnfc_type_name_map, {get_param: [cbam, extensions, vnfc_type_name_case]}, oam]}
      roles: [management, external-connectivity, 5gbts_oam_2n]
      instance_params:
        map_merge:
        - get_param: [cbam, resources, oam_node_in_redundant]
        - server_group_id: {get_resource: oam_cpif_server_group}
      availability_zones:
        azId0: {get_attr: [common_available_zones, az_lists, oam_0]}
        azId1: {get_attr: [common_available_zones, az_lists, oam_1]}
      key_name: {get_resource: keypair}
      number_of_nodes_redundant:
        deployment:
          number_of_cpcl: 2
          number_of_cpue: {get_attr: [cpue_count, value]}
          number_of_upue: {get_attr: [upue_count, value]}
          min_number_of_cpcl: 1
          min_number_of_cpue: 1
          min_number_of_upue: 1
          max_number_of_cpcl: 2
          max_number_of_cpue: 10
          max_number_of_upue: 36
      oam_net_0:
        name: oam
        uuid: {get_attr: [network_setup, networks, oam]}
        ip_address: {get_param: [cbam, extensions, oam_ip_0]}
        logical_ip: {get_param: [cbam, extensions, oam_ip_logical]}
        port_type: {get_param: oam_port_type}
        mtu: {get_param: [cbam, extensions, oam_port_mtu]}
        pmtu: {get_param: [cbam, extensions, oam_pmtu]}
      oam_net_1:
        name: oam
        uuid: {get_attr: [network_setup, networks, oam]}
        ip_address: {get_param: [cbam, extensions, oam_ip_1]}
        logical_ip: {get_param: [cbam, extensions, oam_ip_logical]}
        port_type: {get_param: oam_port_type}
        mtu: {get_param: [cbam, extensions, oam_port_mtu]}
        pmtu: {get_param: [cbam, extensions, oam_pmtu]}
      internal_networks:
        count: 2
        net_list:
        - name: internal
          uuid: {get_attr: [network_setup, networks, internal]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
        - name: internal_srv
          uuid: {get_attr: [network_setup, networks, internal_srv]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal_srv, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
      external_networks:
        count: 2
        net_list:
        - name: sriov_a
          uuid: {get_attr: [network_setup, networks, extnet_a]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
        - name: sriov_b
          uuid: {get_attr: [network_setup, networks, extnet_b]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
      lrvl_information:
        count: 1
        net_list:
        - name: f1om
          sid: {get_attr: [network_setup, networks, f1om_sid]}
          ip: {get_attr: [network_setup, networks, f1om_ip_oam_0]}
          role: {get_attr: [network_setup, networks, f1om_role_oam_0]}
          ip_se: {get_attr: [network_setup, networks, f1om_ip_oam_1]}
          role_se: {get_attr: [network_setup, networks, f1om_role_oam_1]}
      ntp_servers: {get_param: [cbam, extensions, ntp_servers]}
      cluster_id:
        str_replace:
          template: $vnf-$cid
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      timezone: {get_param: [cbam, extensions, timezone]}
      dns_forwarders: {get_param: [cbam, extensions, dns_forwarders]}
      dpdk_type: none
      cinder_volumes:
        count: 2
        vol_list:
        -
          size: 45
          name: &redandunt_oam_0_vol_name
            str_replace:
              template: $vnf-$cid-oam-000-vol
              params:
                $vnf: {get_param: [cbam, extensions, vnf_name]}
                $cid: {get_param: [cbam, extensions, cluster_id]}
        -
          size: 45
          name: &redandunt_oam_1_vol_name
            str_replace:
              template: $vnf-$cid-oam-001-vol
              params:
                $vnf: {get_param: [cbam, extensions, vnf_name]}
                $cid: {get_param: [cbam, extensions, cluster_id]}
      lvm_local_volumes_0:
        count: 3
        vol_list:
        - {size: 10000M, name: dbcm, mount: /mnt/dbcm, volume: *redandunt_oam_0_vol_name}
        - {size: 12000M, name: db_redis_session, mount: /mnt/db_redis_session, volume: *redandunt_oam_0_vol_name}
        - {size: 1000M, name: storageconf, mount: /var/lib/glusterd, volume: *redandunt_oam_0_vol_name}
      lvm_local_volumes_1:
        count: 3
        vol_list:
        - {size: 10000M, name: dbcm, mount: /mnt/dbcm, volume: *redandunt_oam_1_vol_name}
        - {size: 12000M, name: db_redis_session, mount: /mnt/db_redis_session, volume: *redandunt_oam_1_vol_name}
        - {size: 1000M, name: storageconf, mount: /var/lib/glusterd, volume: *redandunt_oam_1_vol_name}
      lvm_gfs_nodes:
        repeat:
          for_each:
            <name>: {get_param: [lvm_gfs_nodes, {get_param: [cbam, extensions, vnfc_type_name_case]}]}
          template:
            str_replace:
              template: <prefix>-<cid>-<name>
              params:
                <prefix>: {get_param: [cbam, extensions, vnf_name]}
                <cid>: {get_param: [cbam, extensions, cluster_id]}
      lvm_gfs_volumes_0:
        count: 5
        vol_list:
        - {size: 5000M, name: ccs, mount: /mnt/ccs, volume: *redandunt_oam_0_vol_name}
        - {size: 1000M, name: mstate, mount: /mnt/mstate, volume: *redandunt_oam_0_vol_name}
        - {size: 5000M, name: export, mount: /mnt/export, volume: *redandunt_oam_0_vol_name}
        - {size: 1000M, name: log, mount: /mnt/log, volume: *redandunt_oam_0_vol_name}
        - {size: 2000M, name: services, mount: /mnt/services, volume: *redandunt_oam_0_vol_name}
      lvm_gfs_volumes_1:
        count: 5
        vol_list:
        - {size: 5000M, name: ccs, mount: /mnt/ccs, volume: *redandunt_oam_1_vol_name}
        - {size: 1000M, name: mstate, mount: /mnt/mstate, volume: *redandunt_oam_1_vol_name}
        - {size: 5000M, name: export, mount: /mnt/export, volume: *redandunt_oam_1_vol_name}
        - {size: 1000M, name: log, mount: /mnt/log, volume: *redandunt_oam_1_vol_name}
        - {size: 2000M, name: services, mount: /mnt/services, volume: *redandunt_oam_1_vol_name}
      service_ip_meta:
        get_attr: [network_setup, service_ip_map]
      extra_cloud_config_data: {get_param: [cbam, extensions, extra_cloud_config_data]}
      config_drive: {get_param: config_drive}
      enable_sriov: {get_param: enable_sriov}
      cloudplatform: {get_param: cloudplatform}
      enable_internal_dhcp: {get_param: enable_internal_dhcp}
      oam_default_gw: {get_param: [cbam, extensions, oam_default_gw]}
      oam_security_group: {get_param: [cbam, extensions, oam_security_group]}
      user_data:
        get_attr: [common_params, user_data]
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata_general]
        - get_attr: [common_params, metadata_sriov]

  cpif_nodes:
    condition: deploy_basic_condition
    depends_on: [oam_node, upue_nodes]
    type: 5GBTS::Node::Common
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm-$idx
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: {get_param: [vnfc_type_name_map, {get_param: [cbam, extensions, vnfc_type_name_case]}, cpif]}
            $idx: "000"
      roles: [application, 5gbts_cpif]
      instance_params: {get_param: [cbam, resources, cpif_nodes]}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, cpif_0]}
      internal_networks:
        count: 3
        net_list:
        - name: internal
          uuid: {get_attr: [network_setup, networks, internal]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
        - name: internal_srv
          uuid: {get_attr: [network_setup, networks, internal_srv]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal_srv, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
        - name: internal_e1
          uuid: {get_attr: [network_setup, networks, internal_e1]}
          addrpair: [{get_attr: [network_setup, service_ip_map, internal-service-ip-pool, internal_e1, cidr]}]
          port_type: {get_param: int_port_type}
          mtu: {get_param: [cbam, extensions, int_port_mtu]}
          pmtu: {get_param: [cbam, extensions, int_pmtu]}
          nuage_enabled: {get_attr: [nuage_enabled, value]}
      external_networks:
        count: 2
        net_list:
        - name: sriov_a
          uuid: {get_attr: [network_setup, networks, extnet_a]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
        - name: sriov_b
          uuid: {get_attr: [network_setup, networks, extnet_b]}
          port_type: {get_param: ext_port_type}
          mtu: {get_param: [cbam, extensions, ext_port_mtu]}
          pmtu: {get_param: [cbam, extensions, ext_pmtu]}
          trunked_nets: {get_attr: [network_setup, networks, trunked_nets]}
      lrvl_information:
