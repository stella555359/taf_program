        count: 1
        vol_list:
        - size: 4
          name: &db_vol_name
            str_replace:
              template: $vnf-$cid-db-vol
              params:
                $vnf: {get_param: [cbam, extensions, vnf_name]}
                $cid: {get_param: [cbam, extensions, cluster_id]}
      lvm_local_volumes:
        count: 2
