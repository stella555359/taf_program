  int_ports:
    value: {get_attr: [oam_node, int_ports]}
    condition: deploy_basic_condition
  ext_ports:
    value: {get_attr: [oam_node, ext_ports]}
    condition: deploy_basic_condition
  oam_port:
    value: {get_attr: [oam_node, oam_port]}
    condition: deploy_basic_condition
  ports:
    value: {get_attr: [oam_node, ports]}
    condition: deploy_basic_condition
  ip-info:
    value: {get_attr: [oam_node, ip-info]}
    condition: deploy_basic_condition
