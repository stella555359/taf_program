AppServer1: &APP_SERVER_1                       # application server definition
   address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.60'            # ip of interface used for LTE data transfer
   expected_prompt: '5g@SKA-HC14-15-AppServer'



UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '23'       # number of com port supporting AT commands
                    configuration:
                        ue_pc_address: 'plkr-sg07-12.intra.noklab.net'        # UE PC domain address or IP
                        # 'plkr-sg07-12.intra.noklab.net' raw adres equals '10.84.182.249'
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        proxy_mngr_port: 9955                                 # taf.ue.proxy.mngr support Quectel UEs
                        ue_pc_expected_prompt: 'pzkrk@PLKR-SG07-12'           # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-SG07-12'
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 7'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
