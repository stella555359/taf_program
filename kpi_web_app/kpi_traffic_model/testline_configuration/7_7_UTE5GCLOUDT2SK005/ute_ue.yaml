AppServer1: &APP_1                              # 1st application server definition
   address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.60'              # OPTIONAL ip of interface used for LTE data transfer


UE_POOLS:
    TafUeAndroidPool:                   # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
        inline_config:
            ANDROID_UE_1:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    #serial_number: 'R3CR207LT9F'                                             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    serial_number: 'R5CT4235YGM'
                    configuration:
                        ue_pc_address: 'PLKR-WMP-UE28.intra.noklab.net'
                        ue_pc_ip: 'PLKR-WMP-UE28.intra.noklab.net'
                        ue_pc_login: 'user-lab0'                               # MANDATORY
                        login: 'user-lab0'
                        password: 'Bts2003'
                        ue_pc_password: 'Bts2003'                                # MANDATORY
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
                        phone_number: '+358480500013'                           # OPTIONAL
                        ue_pc_port: '80'                                      # OPTIONAL
                        #   ========= Android specific: =========
                        qualcomm_prototype: no                                # OPTIONAL
                        network_mode_switch_method: 'ADB'                       # OPTIONAL Available values: adb, xposed, keyevents, secretcode. In case of adb - no rooting and xposed installation required
                                                                                #   Use keyevents to use keyevents for change_network_mode, get_ue_info, log_ue_info, validate_ue_info of PREFERRED_NET_MODE
                                                                                #   Use secretcode to use secretcode panel to change_network_mode
                                                                                #   keyevents mode is actually supported only on UEs with Android 12
                                                                                #   secretcode mode is used only on Samsungs with Android 12
            ANDROID_UE_2: # UE name
                CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE_2
                    - REAL_ANDROID_UE_2
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'R3CR100LYWV'                                             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: 'PLKR-WMP-UE28.intra.noklab.net'
                        ue_pc_ip: 'PLKR-WMP-UE28.intra.noklab.net'
                        ue_pc_login: 'user-lab0'                               # MANDATORY
                        login: 'user-lab0'
                        password: 'Bts2003'
                        ue_pc_password: 'Bts2003'                                # MANDATORY
                        data_transfer: # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
                        phone_number: '+358480500013'                           # OPTIONAL
                        ue_pc_port: '80'                                      # OPTIONAL
                        #   ========= Android specific: =========
                        qualcomm_prototype: no                                # OPTIONAL
                        network_mode_switch_method: 'ADB'
