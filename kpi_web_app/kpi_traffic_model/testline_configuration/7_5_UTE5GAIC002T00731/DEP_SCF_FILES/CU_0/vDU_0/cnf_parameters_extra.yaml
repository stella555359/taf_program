        vid: "301"
        pcp: "7"
      - vlName: "fhucplane02"
        defaultUnderlyingIface: "ecpri4"
        vid: "302"
        pcp: "7"
      - vlName: "fhucplane03"
        defaultUnderlyingIface: "ecpri4"
        vid: "303"
        pcp: "7"
    fhm:
      ipInfo:
      - rangeEnd: 192.168.254.35
        rangeStart: 192.168.254.35
        role:
        - fhm
        subnet: 192.168.254.0/26
        type: physical


