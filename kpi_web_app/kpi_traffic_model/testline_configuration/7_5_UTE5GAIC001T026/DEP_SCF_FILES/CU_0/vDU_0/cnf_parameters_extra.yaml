  # - Description: network attribute definition for each network.
  #   This section is provide to set the MTU for each network
  networkInfo:
    fhm:
      mtu: 1500
    tracing:
      mtu: 1500
    oam:
      mtu: 1500
    f1c:
      mtu: 1500
    bip:
      mtu: 9000
    fhuc:
      mtu: 1500
    f1:
      mtu: 1500

  # service configuration
  service:
    sdl:
      deploymode: sentinel

# ========configuration oamfh POD =========
aic-oamfh:
  # ========configuration about dhcp container ========
  dhcp:
    service:
      # Indicate internal or external dhcp server to be used, the default value is internal
      dhcpServerLocation: "internal"
      # v4PoolsStart and v4PoolsEnd define the actual part of your subnet that is governed
      v4PoolsStart: 192.168.252.34
      v4PoolsEnd: 192.168.252.60
      # v4Subnet define the whole subnet.
      v4Subnet: 192.168.252.0/26

      # DHCP vendor specific information of master agent ip and port number
      option43_vendor_specific_information_master_agent_ip: "192.168.252.33"
      option43_vendor_specific_information_port_number: "13001"


# - Description: sub chart rcpsdl private configuration
rcpsdl:
  cluster:
    enabled: true
