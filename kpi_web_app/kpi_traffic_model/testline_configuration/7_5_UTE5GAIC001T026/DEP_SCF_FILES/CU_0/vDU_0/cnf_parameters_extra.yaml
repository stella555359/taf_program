  cnfLayout: "CRAN"
  upcount: 2

  externalNetwork:
    fhm:
      vlanInfo:
        vid: 297
        pcp: 2
      ipInfo:
      - rangeStart: "192.168.252.33"
        rangeEnd: "192.168.252.33"
        subnet: "192.168.252.0/26"
        type: "physical"
        role:
        - "fhm"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        vid: 193
      ipInfo:
      - rangeStart: "10.106.150.146"
        rangeEnd: "10.106.150.147"
        subnet: "10.106.150.144/28"
        type: "physical"
        role:
