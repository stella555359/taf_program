AppServer1: &APP_1
    address: '10.84.168.121'
    user: '5g'
    password: '5g'
    bind_interface_ip: '10.84.169.61'
    expected_prompt: '5g@SKA-HC14-16-AppServer2:.*\$\s+'
UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            ANDROID_UE_1: # UE name - change if you want
                CAPABILITIES: # Capabilities that UE has. (as a list)
                    - REAL_UE
                CLASS: AndroidUe # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: "R5CT60ETACW" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_address: "PLKR-SG01-08.p01.ska-lab.nsn-rdnet.net" # UE PC IP address
                        ue_pc_port: "8080" # TCP Port number on UE PC on which Pyro server will be started
                        login: "pzkrk" # SSH login to UE PC
                        password: "NokiaBts2003" # SSH password to UE PC
                        service_call_attach: '16'
                        service_call_detach: '16'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: '1'
                                binary_path: '/data/data/com.nokia.android.application/' # OPTIONAL iperf binary location (it is optional when you want to use your own iperf version or unable to install UeManager ap
