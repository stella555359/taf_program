UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            COM6:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - AT_UE
                CLASS: AtUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '6'        # number of com port supporting AT commands
                    serial_number: 'd2c7172a'    # OPTIONAL, UE serial number used by data transfer (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.71.218.235'      # UE PC domain address or IP
                        ue_pc_login: 'mn5gran'
                        ue_pc_password: 'nokia123@'
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1                                   # OPTIONAL, default is 80
                                interface_name: 'Cellular 2'                  # OPTIONAL
                                dt_from_uepc: False                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                                path: '/cygdrive/c/iperf/'
                                ue_expected_prompt: 'MN5GRAN@CNHZ5GRAN2438$'
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
