# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

# NCIR specific parameters
# Preconditon: tenant's configuration is ready before deploy internal network
# internal network
internal:
  #Description: the master interface of ipvlan, mandatory.
  #Value range: string, no default value.
  #Note: This value need to match with the tenant's configuration. eg."ens1f1"
  hostDevice: "ens1f1"
  cidr: "192.168.1.0/24"
  allocationPoolStart: "192.168.1.2"
  allocationPoolEnd: "192.168.1.254"
bipVLANMode: "GUEST"
f1VLANMode: "GUEST"
f1cVLANMode: "GUEST"
fhmVLANMode: "GUEST"
fhucVLANMode: "GUEST"
oamVLANMode: "GUEST"
tracingVLANMode: "GUEST"
netPF:
    # - Description: The SR-IOV Device Pool used by f1 and bip networks (fast path) for Guest VLAN (HOST-DPDK binding)
  commonHostBind: "nokia.k8s.io/sriov_vfio_ens1f1"
  common: "nokia.k8s.io/sriov_ens1f1"
  fhHostBind: "nokia.k8s.io/sriov_vfio_ens1f1"
  fh: "nokia.k8s.io/sriov_ens1f1"
VLANID:
  l1bip: ""
  l2bip: ""
  oam: ""
  f1: ""
  f1c: ""
  fhm: ""
  fhuc: ""
  tracing: ""
