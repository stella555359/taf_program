UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'R3CTA05ES1Z'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.84.173.11'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'user-lab0'            # SSH login to UE PC
                        password: 'Bts2003'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        clear_logs: True
                        clear_server_files: True
                        service_call_attach: '17'
                        service_call_detach: '17'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'putty'
                        data_transfer:
                            iperf_path: '/data/user/0/com.nokia.android.application/' # OPTIONAL iperf binary location (it is optional when you want to use your own iperf version or unable to install UeManager apk)
                            iperf_interval: '1'                 # Iperf interval in seconds (default: 1)
                            app_servers:
                                APP_1:      # 1st iperf server alias
                                    host: '10.84.168.70' # Application Server IP
                                    user: '5g'     # Application Server SSH login
                                    password: '5g' # Application Server SSH password
                                    iperf_interface_ip: '10.84.169.54' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
