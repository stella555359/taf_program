AppServer1: &APP_SERVER_1                       # application server definition
   address: '10.83.249.130'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.83.249.189'            # ip of interface used for LTE data transfer
   expected_prompt: '5g@SRN-Appserver-Krakow'


UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: AtUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '12'       # number of com port supporting AT commands'
                    configuration:
                        ue_pc_address: 'PLKR-DMRS-UE1.sc5g.krk-lab.nsn-rdnet.net'        # UE PC domain address or IP
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        #   ========= At specific: =========
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        ue_pc_expected_prompt: 'plkr-dmrs-ue1.sc5g.krk-lab.nsn-rdnet.net'
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 2'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
