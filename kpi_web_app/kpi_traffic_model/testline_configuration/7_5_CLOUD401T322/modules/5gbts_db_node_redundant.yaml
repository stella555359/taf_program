heat_template_version: 2016-10-14
description: Template for 5gbts application node

parameters:
  name:
    description: Name to be used as the host name for the VM
    type: string
  internal_networks:
    description: Internal networks
    type: json
    default:
      count: 0
      net_list: []
  external_networks:
    description: External networks
    type: json
    default:
      count: 0
      net_list: []
  database_ip:
    description: IP address to reach centralized database service
    type: string
  timezone:
    type: string
    constraints:
      - custom_constraint: timezone
  dpdk_type:
    type: string
    default: none
  cluster_id:
    type: string
    description: Cluster identity
    constraints:
      - allowed_pattern: "[a-zA-Z0-9-]+"
  storage_meta:
    description: Storage user parameters for shared volumes
    type: json
  cinder_volumes:
    type: json
    description: parameters for cinder volumes
    default:
      count: 0
      vol_list: []
  lvm_local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  ha_cluster:
    description: HA nodes acting as etcd member instances and quorate voter
    type: string
  instance_params:
    type: json
  roles:
    description: Deployment roles associated
    type: comma_delimited_list
    default: [application]
  extra_cloud_config_data:
    type: json
    description: custom cloud init configuration
    default: {}
  upgrade-node:
    type: boolean
    description: indicate whether it is upgrade node
    default: false
  number_of_nodes:
    type: json
    description: node count information
    default: {}
  config_drive:
    description: Use config drive instead of metadata server
    type: boolean
    default: true
  enable_sriov:
    description: flag of enable sriov vlan tag function
    type: boolean
    default: true
  cloudplatform:
    description: cloud platform
    type: string
  vnfindex:
    description: count of vm
    type: number
  enable_internal_dhcp:
    type: boolean
    description: Enable internal network dhcp
    default: False

conditions:
  attache_cinder_volume:
    not:
      equals:
      - get_param:
        - cinder_volumes
        - count
      - 0
  assemble_local_volumes:
    not:
      equals:
      - get_param:
        - lvm_local_volumes
        - count
      - 0

resources:
### affinity relationship between same kind of vm
  server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $name-server-group
          params:
            $name: {get_param: name}
      policies:
        - anti-affinity
### Networks
  ports_0:
    type: 5GBTS::Networks::Common::Redundant
    properties:
      internal_networks: {get_param: internal_networks}
      external_networks: {get_param: external_networks}
      name_prefix: {get_param: name}
      vnfindex: {get_param: vnfindex}

  ports_1:
    type: 5GBTS::Networks::Common::Redundant
    properties:
      internal_networks: {get_param: internal_networks}
      external_networks: {get_param: external_networks}
      name_prefix: {get_param: name}
      vnfindex: {get_param: vnfindex}

## lvm_local disks
  lvm_local_vol_0:
    type: RCP::VolumeGroup::LVMLocal
    condition: assemble_local_volumes
    properties:
      lvm_volumes:
        get_param: [lvm_local_volumes]
  lvm_local_vol_1:
    type: RCP::VolumeGroup::LVMLocal
    condition: assemble_local_volumes
    properties:
      lvm_volumes:
        get_param: [lvm_local_volumes]
## lvm disks
  shared_vol_0:
    type: RCP::Volume::Cinder
    condition: attache_cinder_volume
    properties:
      vol_name:
        get_param: [cinder_volumes, vol_list, 0, name]
      vol_size:
        get_param: [cinder_volumes, vol_list, 0, size]
  shared_vol_attach_0:
    type: OS::Cinder::VolumeAttachment
    condition: attache_cinder_volume
    properties:
      volume_id:
        get_attr: [shared_vol_0, cinder_volume_id]
      instance_uuid: {get_resource: server_0}
  shared_vol_1:
    type: RCP::Volume::Cinder
    condition: attache_cinder_volume
    properties:
      vol_name:
        get_param: [cinder_volumes, vol_list, 0, name]
      vol_size:
        get_param: [cinder_volumes, vol_list, 0, size]
  shared_vol_attach_1:
    type: OS::Cinder::VolumeAttachment
    condition: attache_cinder_volume
    properties:
      volume_id:
        get_attr: [shared_vol_1, cinder_volume_id]
      instance_uuid: {get_resource: server_1}

  cloud_config_0:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: $vnfname-$num
            params:
              $vnfname: {get_param: name}
              $num: 0
        timezone: {get_param: timezone}

  cloud_config_1:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: $vnfname-$num
            params:
              $vnfname: {get_param: name}
              $num: 1
        timezone: {get_param: timezone}

  extra_cloud_config_0:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        {get_param: extra_cloud_config_data}

  extra_cloud_config_1:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        {get_param: extra_cloud_config_data}

  cloud_init_0:
    type: OS::Heat::MultipartMime
    properties:
      parts:
        - config: {get_resource: cloud_config_0}
          subtype: cloud-config
        - config: {get_resource: extra_cloud_config_0}
          subtype: cloud-config

  cloud_init_1:
    type: OS::Heat::MultipartMime
    properties:
      parts:
        - config: {get_resource: cloud_config_1}
          subtype: cloud-config
        - config: {get_resource: extra_cloud_config_1}
          subtype: cloud-config

  server_0:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: $vnfname-$num
          params:
            $vnfname: {get_param: name}
            $num: 0
      image: {get_param: [instance_params, server_0, imageId]}
      flavor: {get_param: [instance_params, server_0, flavorId]}
      availability_zone: {get_param: [instance_params, server_0, azId]}
      scheduler_hints:
        group: {get_resource: server_group}
      networks: {get_attr: [ports_0, ports]}
      user_data_format: RAW
      user_data: {get_resource: cloud_init_0}
      metadata:
        map_merge:
        -
          database: {get_param: database_ip}
          roles: {get_param: roles}
          dpdk-conf-type: {get_param: dpdk_type}
          cluster-id: {get_param: cluster_id}
          etcd-instances: [get_param: ha_cluster]
          quorate-monitor-voter-nodes: [get_param: ha_cluster]
          cloudplatform: {get_param: cloudplatform}
          enable-sriov: {get_param: enable_sriov}
          enable_internal_dhcp: {get_param: enable_internal_dhcp}
        -
          get_attr: [ports_0, ip-info]
        - if:
          - attache_cinder_volume
          - get_attr: [shared_vol_0, cinder_volume_map]
          - {}
        - if:
          - assemble_local_volumes
          - get_attr: [lvm_local_vol_0, provider_map]
          - {}
        -
          get_param: storage_meta
        -
          upgrade-node: {get_param: upgrade-node}
        -
          get_param: number_of_nodes
      config_drive: {get_param: config_drive}

  server_1:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: $vnfname-$num
          params:
            $vnfname: {get_param: name}
            $num: 1
      image: {get_param: [instance_params, server_1, imageId]}
      flavor: {get_param: [instance_params, server_1, flavorId]}
      availability_zone: {get_param: [instance_params, server_1, azId]}
      scheduler_hints:
        group: {get_resource: server_group}
      networks: {get_attr: [ports_1, ports]}
      user_data_format: RAW
      user_data: {get_resource: cloud_init_1}
      metadata:
        map_merge:
        -
          database: {get_param: database_ip}
          roles: {get_param: roles}
          dpdk-conf-type: {get_param: dpdk_type}
          cluster-id: {get_param: cluster_id}
          etcd-instances: [get_param: ha_cluster]
          quorate-monitor-voter-nodes: [get_param: ha_cluster]
          cloudplatform: {get_param: cloudplatform}
          enable-sriov: {get_param: enable_sriov}
          enable_internal_dhcp: {get_param: enable_internal_dhcp}
        -
          get_attr: [ports_1, ip-info]
        - if:
          - attache_cinder_volume
          - get_attr: [shared_vol_1, cinder_volume_map]
          - {}
        - if:
          - assemble_local_volumes
          - get_attr: [lvm_local_vol_1, provider_map]
          - {}
        -
          get_param: storage_meta
        -
          upgrade-node: {get_param: upgrade-node}
        -
          get_param: number_of_nodes
      config_drive: {get_param: config_drive}

outputs:
  internal_ip:
    description: Internal IP address allocated to access the node
    value: {get_attr: [ports_0, internal_ip]}
