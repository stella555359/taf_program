UE_POOLS:
  TafUeAtPool: # Ue Pool class defined by library
    inline_config:
      dongle_B66_n41: # UE name
        CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
          - REAL_UE1
        #STARTING_CELL: 0x4C2E4002 # 1278099458
        CLASS: Quectel
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AtUe constructor when Ue instance is created.
          com_port: '59'        # number of com port supporting AT commands
          configuration:
            ue_pc_address: 'PLKR-SC5G-PC83.intra.noklab.net'      # UE PC domain address or IP
            ue_pc_login: 'pzkrk'
            ue_pc_password: 'NokiaBts2003'
            ue_pc_port: 80                                        # OPTIONAL, default is 80
            ue_pc_expected_prompt: 'pzkrk@PLKR-SC5G-PC83'    # OPTIONAL but if you want to run dt from ue pc interface is mandatory
            data_transfer: # data transfer protocols
              iperf:
                app_server: *APP_SERVER_1
                interval: 1                                   # OPTIONAL, default is 80
                server_close_delay: 50
                version: 2                                # iperf version: 2 or 3
                binary_path: '/cygdrive/c/iperf/'
                interface_name: 'Cellular 15'                 # OPTIONAL   <- ipconfig - check interface after ue attach
                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
              ping:
                app_server: *APP_SERVER_1
                interval: 1
              ftp:
                app_server: *APP_SERVER_1

      dongle_n77_n78: # UE name
        CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
          - REAL_UE2
        CLASS: Quectel
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AtUe constructor when Ue instance is created.
          com_port: '56'        # number of com port supporting AT commands
          configuration:
            ue_pc_address: 'PLKR-SC5G-PC83.intra.noklab.net'      # UE PC domain address or IP
            ue_pc_login: 'pzkrk'
            ue_pc_password: 'NokiaBts2003'
            ue_pc_port: 80                                        # OPTIONAL, default is 80
            ue_pc_expected_prompt: 'pzkrk@PLKR-SC5G-PC83'    # OPTIONAL but if you want to run dt from ue pc interface is mandatory
            data_transfer: # data transfer protocols
              iperf:
                app_server: *APP_SERVER_1
                interval: 1                                   # OPTIONAL, default is 80
                server_close_delay: 50
                version: 2                                # iperf version: 2 or 3
                binary_path: '/cygdrive/c/iperf/'
                interface_name: 'Cellular 14'                 # OPTIONAL   <- ipconfig - check interface after ue attach
                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
              ping:
                app_server: *APP_SERVER_1
                interval: 1
              ftp:
                app_server: *APP_SERVER_1
