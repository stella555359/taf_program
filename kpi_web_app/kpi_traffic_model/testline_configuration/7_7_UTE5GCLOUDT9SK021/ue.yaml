APP_SERVER: &APP_SERVER
    ssh: &APP_SERV_CRED
        address: '10.84.168.120'
        user: '5g'
        password: '5g'
        bind_interface_ip: '10.84.169.60'
    lte_network_ip: '10.84.169.60'

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            UE_1:
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: '20109313'
                STARTING_CELL_5G_PCI: 51
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'R5CT604WC2T'
                    configuration:
                        ue_pc_address: 'PLKR-SG06-02.intra.noklab.net'
                        ue_pc_port: '80'
                        voice_call_dialing_timeout: '30'
                        network_mode_switch_method: 'adb'
                        service_call_attach: '16'
                        service_call_detach: '16'
                        data_transfer:
                            binary_path: '/data/data/com.nokia.android.application/'
                            app_servers:
                                SKA_1: *APP_SERV_CRED
                            iperf_interval: '1'
                            iperf_options:
                                packet: '1200B'
                                buffer: '4M'

