ATTENUATORS:
    JFW:                                      # attenuator name - change if you want
        TYPE: JFW                               # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.hytem.HytemAttenuator
        CONSTRUCTOR_PARAMETERS:                       # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.255.40.51'                        # IP address of attenuator device
            port: 3001                               # TCP Port number of attenuator device
            min_attenuation: 0
            max_attenuation: 60

CELLS_ATTENUATION:
    ENB_CELL_1:
        rf_paths_of_cell:
        -   used_attenuator: JFW
            rf_paths_at_attenuator:
            - 1
            - 2
    ENB_CELL_2:
        rf_paths_of_cell:
        -   used_attenuator: JFW
            rf_paths_at_attenuator:
            - 3
            - 4
