heat_template_version: 2016-10-14
description: Template for creating external network with instance spesific configuration parameters

parameters:
  index:
    description: Instance index to use to fetch spesific parameters from params list
    type: number

  vnf_name:
    type: string
    description: 5gbts vnf name
    default: vBTS
    constraints:
      - length: {min: 4, max: 26}
        description: ( VNF NAME must be length <4-26>)

  internal_networks:
    description: List of instance spesific parameters for each network to create
    type: json

resources:
  net:
    type: OS::Neutron::Net
    properties:
      admin_state_up: true
      name:
        str_replace:
          template: $vnf-$net_net-v$version
          params:
            $vnf: {get_param: vnf_name}
            $net: {get_param: [internal_networks, {get_param: index}, name]}
            $version: {get_param: [internal_networks, {get_param: index}, ip_ver]}
      tenant_id: {get_param: [internal_networks, {get_param: index}, tenant_id]}

outputs:
  net_uuid:
    description: Network with uuid
    value:
      str_replace:
        template: |
          $vnf-$net_net-v$version: $uuid
        params:
          $vnf: {get_param: vnf_name}
          $net: {get_param: [internal_networks, {get_param: index}, name]}
          $version: {get_param: [internal_networks, {get_param: index}, ip_ver]}
          $uuid: {get_resource: net}
