heat_template_version: 2016-10-14
description: Template to create networks interfaces for a management node with dedicated oam network

parameters:
  oam_network:
    type: json
    description: OAM network
  internal_networks:
    type: json
    description: Internal networks
    default:
      count: 0
      net_list: []
  external_networks:
    type: json
    description: External networks
    default:
      count: 0
      net_list: []
  name_prefix:
    type: string
    description: The prefix name of ports
    default: vbts
  oam_default_gw:
    description: oam network default gw
    type: string
  lo_information:
    type: json
    description: lo ipaddress/roles value
    default:
      count: 0
      net_list: []
  vnfindex:
    description: count of vm
    type: number
  oam_security_group:
    description: oam port security group
    type: string

resources:
  int_ports:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [internal_networks, count]}
      resource_def:
        type: 5GBTS::Network::IntInterface
        properties:
          role: internal
          index: "%index%"
          networks: {get_param: [internal_networks, net_list]}
          name_prefix: {get_param: name_prefix}

  ext_ports:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [external_networks, count]}
      resource_def:
        type: 5GBTS::Network::ExtInterface::Redundant
        properties:
          role: external
          index: "%index%"
          networks: {get_param: [external_networks, net_list]}
          name_prefix: {get_param: name_prefix}
          vnfindex: {get_param: vnfindex}

  loop_resource:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [lo_information, count]}
      resource_def:
        type: 5GBTS::Network::loInform
        properties:
          index: '%index%'
          lo_info_list: {get_param: [lo_information, net_list]}
          vnfindex: {get_param: vnfindex}

  oam_port:
    type: 5GBTS::Network::FixedIPInterface
    properties:
      role: oam
      networks: {get_param: oam_network}
      name_prefix: {get_param: name_prefix}
      oam_security_group: {get_param: oam_security_group}

outputs:
  int_ports:
    value: {get_attr: [int_ports, port]}
  ext_ports:
    value: {get_attr: [ext_ports, port]}
  oam_port:
    value: {get_attr: [oam_port, port]}
  ports:
    value:
      repeat:
        for_each:
          <%port%>:
            str_split:
            - ','
            - {list_join: [',', get_attr: [int_ports, port], get_attr: [ext_ports, port], [get_attr: [oam_port, port]]]}
        template:
          port: <%port%>
  ip-info:
    value:
      map_merge:
      - {get_attr: [oam_port, ip-info]}
      - {map_merge: {get_attr: [int_ports, ip-info]}}
      - {map_merge: {get_attr: [ext_ports, ip-ext-info]}}
      - {map_merge: {get_attr: [loop_resource, loop_info]}}
  oam-info:
    value:
      oam-ip:
        interface: oam
        type: physical
        roles:
        - ssh
        ip-addrs:
        - {list_join: ['/', [{get_attr: [oam_port, ip_address]}, {get_attr: [oam_port, ip_prefix]}]]}
      oam-default-gws:
      - {get_param: oam_default_gw}
      #- {get_attr: [oam_port, gw_address]}
  oam_ip:
    value: {get_attr: [oam_port, ip_address]}
  internal_ip:
    value: {get_attr: [int_ports, resource.0, ip_address]}
