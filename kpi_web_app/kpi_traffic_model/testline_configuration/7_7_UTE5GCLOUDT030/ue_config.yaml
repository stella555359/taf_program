AppServer1: &APP_SERVER_1                       # application server definition
  address: '10.83.249.130'
  user: '5g'
  password: '5g'
  bind_interface_ip: '10.83.249.189'            # ip of interface used for LTE data transfer
  expected_prompt: '5g@SRN-Appserver-Krakow'

UE_POOLS:
  TafUeAndroidPool:                         # Ue Pool class defined by library
    inline_config:
      ANDROID_UE:                  # UE name
        CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
          - REAL_UE
          - REAL_ANDROID_UE
        CLASS: AndroidUe
        CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
          serial_number: '99b05df'
          network_mode_switch_method: 'ADB'
          configuration:
            ue_pc_address: 'PLKR-DMRS-UE4.intra.noklab.net'        # UE PC domain address or IP
            ue_pc_port: 80                                        # OPTIONAL, default is 80
            #   ========= At specific: =========
            ue_pc_login: 'PLKR-DMRS-UE4+user-lab0'
            ue_pc_password: 'Bts2003'
            ue_pc_expected_prompt: 'PLKR-DMRS-UE4+user-lab0@PLKR-DMRS-UE4'
            data_transfer:                                        # data transfer protocols
              iperf:
                app_server: *APP_SERVER_1
                interval: 1
                server_close_delay: 50                          # OPTIONAL
                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                ping:
                  app_server: *APP_SERVER_1
                  interval: 1
                ftp:
                  app_server: *APP_SERVER_1

  AndroidUePool:
    inline_config:
      UE_1: # UE name - change if you want
        CAPABILITIES: # Capabilities that UE has. (as a list)
          - REAL_UE
          - SMAWAVE_UE
        STARTING_CELL: 1 # Cell ID : gNB_I = 0x23169 concat  Cell_Id = 0x50
        CLASS: SMAwave # UE type is SMAwave so SMAwave class will be used
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
          serial_number: "RS621A00211700014" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
          configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
            ue_pc_ip: "10.253.176.106" # UE PC IP address
            pyro_port: "8080" # TCP Port number on UE PC on which Pyro server will be started
            login: "root" # SSH login to UE PC
            password: "3nLQk&%T" # SSH password to UE PC
            server_dir: "/home/pi/pyro_server" # UE PC directory where all server files will be copied
            server_python:
              "python"
              # UE PC python location
            qcat_exe_path:
              ""
              #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
            diag_cfg_path:
              ""
              # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
            data_transfer: # Application Server (for Iperf) details
              ssh:
                host: "10.83.249.132" # Application Server IP
                user: "5g" # Application Server SSH login
                password: "5g" # Application Server SSH password
              iperf_interface_ip:
                "10.83.249.162"
                # Application Server interface used for data transfer
                # (-B iperf parameter)
              # iperf_path: "/data/local/tmp/iperf/bin/iperf"
              ping:
                ping_host_ip: "10.83.249.131" # Remote host for ping (Start Data Transfer icmp protocol)
                ping_count: "10" # ping -c (count) option
                allowed_packet_loss: "5" # Allowed packet loss in %
