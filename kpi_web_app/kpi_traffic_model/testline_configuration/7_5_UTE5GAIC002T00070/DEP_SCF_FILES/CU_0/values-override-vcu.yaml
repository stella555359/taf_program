  # internale1 network common configuration such as subnet,gateway,vlanId
  # all ip address support IPv4/IPv6,IPv4 FORMAT (e.g. "10.0.0.0/24"),IPv6 FORMAT(e.g. "2001:db8::/45")
  # "rangeStart" means start ip address,supportIPv4/IPv6, mandatory to set if you want to creat the network
  # "rangeEnd"  means end ip address,supportIPv4/IPv6,if empty, will be set to the same as rangeStart
  # "vlName" and "defaultUnderlyingIface",recommend not to modify
  # "vid" means the vlan id,mandatory to set if if you want to creat the network,otherwise the network will not be created
  # "role" means ip role for the ip address
  # "subnet" means the subnet of the network, madatory to set if you want to creat the network
  internale1Network:
    internale1:
      vlanInfo:
        - vlName: "internale1"
          defaultUnderlyingIface: "e1"
          vid: "1120"
          ipInfo:
          - subnet: "192.168.200.0/24"
            role:
            - "E1-C"
            ipAddress:
              cpif:
                rangeStart: "192.168.200.4"
                rangeEnd: "192.168.200.4"
              cpnrt:
                rangeStart: "192.168.200.5"
                rangeEnd: "192.168.200.5"

# - Description: the directory for hostpath volume to storage the coredump info
# - Note: the volume will not create if the value is blank.
  coredumppath: *coredumppath
rcpsdl:
  cluster:
    ## when deployed on single node hardAntiAffinity should set to false, otherwise set to true.
    # support value : true or false
    # default value :true
    hardAntiAffinity: true
healing-controller:
  storage:
    # - Description: The healing-controller supports the redundant/basic mode which is enabled by parameter cnfLayout.
    #                The storageClassName should be configurated by user. If leave the storageClassName empty, the default value will be used,
    # - Feautre ID: CB007406-5G
    # - Note:
    #    for redundant, the storageClassName must support the RWX mode.
    #    for basic, the storageClassName should support the RWO mode.
    storageClassName: "ocs-storagecluster-cephfs"

aic-vcu-upue:
  # LRIP configure link redundancy for interface SA(f1u,ngu,xnu), NSA(f1u,x2u,s1u),
  # this is optional setting,if have set vlanId values, this LRIP function will be opened
  # the vlan is for internal used, depends on the lab network plan
  lripRoundcheckInfo:
  - instanceId: "1"
    vlanId: ""
  - instanceId: "2"
    vlanId: ""
aic-vcu-cpif:
