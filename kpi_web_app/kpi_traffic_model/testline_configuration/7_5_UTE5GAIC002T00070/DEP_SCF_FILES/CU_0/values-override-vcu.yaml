# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

# - Description: the directory for hostpath volume to storage the coredump info
# - Note: the default value of coredumpPath is set to "", means coredump will not be saved
# -       this config is for internal trouble shooting if set to host path
# -       example: coredumpPath: &coredumppath "/tmp/cdump"
coredumpPath: &coredumppath "/tmp/cdump"

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: convention of name
  name_convention:
    pod_prefix:
    - po
    - _NAMESPACE_

    container_prefix:
    - ctr
    - _NAMESPACE_

    deployment_prefix:
    - po
    - _NAMESPACE_

    statefulset_prefix:
    - po
    - _NAMESPACE_

  # - Description: registry of image
  # - Support Value: "bcmt-registry:5000/dep" for NCS, "registry.kube-system.svc.nokia.net:5555/dep" for NCIR,  image-registry.openshift-image-registry.svc:5000/<namespace> for ocp
  image:
    registry: "image-registry.openshift-image-registry.svc:5000/cran20"

  # timezone
  timezone: "Asia/Shanghai"

  # - Description: the number of CPUE Pods. If cnfLayout is basic, [1, 4] is officially supported; if cnfLayout is redundant, [2, 4] is officially supported.
  # - Note: If cnfLayout is redundant and cpuecount is 1, it will be modified to 2 automatically.
  cpuecount: 1
  # - Description: the number of UPUE Pods. If cnfLayout is basic, [1, 26] is officially supported; if cnfLayout is redundant, [2, 26] is officially supported.
  # - Note: If cnfLayout is redundant and upuecount is 1, it will be modified to 2 automatically.
  upuecount: 1

  # - Description: the layout of the CU. Redundant means CU supports high availability.
  # - Support Value: basic or redundant
  cnfLayout: "basic"

  # - Description: the network interface device pool list, support link redundancy
  # - Note: if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  # - the fastPathDevicePool and slowPathDevicePoolBackup must not be same
  # - the slowPathDevicePool and slowPathDevicePoolBackup must not be same
  devicePoolList:
    # The SR-IOV Device Pool used by s1u,x2u,f1u,xnu,ngu networks (fast path)
    fastPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Backup Device Pool used by s1u-s,x2u-s,f1u-s,xnu-s,ngu-s networks (fast path),should be different with fastPathDevicePool
    fastPathDevicePoolBackup: ""
    # The SR-IOV Device Pool used by oam,tracing,f1c,x2c,xnc,ngc,internale1 networks (slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Device Pool used by oam-s,f1c-s,x2c-s,xnc-s,ngc-s networks (slow path),should be different with slowPathDevicePool
    slowPathDevicePoolBackup: ""


  # - Description: Infrastructure configuration
  cpuDevicePool:
    # - Support Value: "nokia.k8s.io/shared_pool" for NCS
    #                  "nokia.k8s.io/shared_caas" for NCIR
    #                  "none" for OCP
    sharedCore: "none"
    # - Description:  CPU dedicated cores for fastPathDevicePool
    #   NUMA Node ID for network interfaces - Extract the numa node for the NIC from /sys/class/net/<interface name>/device/numa_node
    #   example:  cat /sys/class/net/ens1f1/device/numa_node
    #   Support Value: "nokia.k8s.io/exclusive_numa_0_pool" or "nokia.k8s.io/exclusive_numa_1_pool" for NCS
    #                  "nokia.k8s.io/exclusive_caas" for NCIR
    #                  "numa_0" or "numa_1" for OCP
    dedicatedCore: "numa_0"




  # external network vlan and ip address configuration
  # Values set base on real network scenario
  # NSA related network include f1c/x2c/s1u/x2u/f1u
  # SA related network include f1c/ngc/xnc/f1u/xnu/ngu
  # all ip address support IPv4/IPv6,IPv4 FORMAT (e.g. "10.0.0.0"),IPv6 FORMAT(e.g. "2001:db8::0")
  # "rangeStart" means start ip address,supportIPv4/IPv6, mandatory to set if you want to creat the network,otherwise the network will not be created
  # "rangeEnd"  means end ip address,support IPv4/IPv6,if empty, will be set to the same as rangeStart
  # for s1u,x2u,ngu,f1u,xnu,if "upuecount"  is 1, the "rangeEnd" should be same as "rangeStart"
  # for s1u,x2u,ngu,f1u,xnu,if "upuecount" is not 1, the count of range between "rangeStart" ip address and "rangeEnd" ip address should equal "upuecount"-1
  # for cpif network f1c,x2c,xnc,ngc, and oam, the "rangeEnd" can be empty or same as "rangeStart"
  # "vlName" and "defaultUnderlyingIface",recommend not to modify
  # "vid" means the vlan id,mandatory to set if if you want to creat the network,otherwise the network will not be created
  # "role" means ip role for the ip address
  # "subnet" means the subnet of the network, madatory to set if you want to creat the network,IPv4 FORMAT (e.g. "10.0.0.0/24"),IPv6 FORMAT(e.g. "2001:db8::0/112")
  # Note:  configured the "rangStart","rangeEnd","vid","subnet" when if you do want to create the network
  # if you don't want to create the network, remember to empty the "rangStart","rangeEnd","vid","subnet"
  externalNetwork:
    oam:
      vlanInfo:
        - vlName: "oamvlan"
          defaultUnderlyingIface: "oam"
          secUnderlyingIface: "oams"
          vid: "1007"
          ipInfo:
          - rangeStart: "10.107.138.119"
            rangeEnd: "10.107.138.119"
            subnet: "10.107.138.96/27"
            role:
            - "oam"
            - "certman-server"
      policyRouteInfo:
        - gateway: "10.107.138.97"
          # - Description: the orderNumber of oam route
          # Note: should different from orderNumber in the SCF file to avoid conflict
          orderNumber: "5"
          # - Description: the table id of oam route
          # recommend not to modify
          table: "2"
  # Note: please do not modify "Tracing" role, it's a WA in 22R2 and will be removed in later release.
    tracing:
      vlanInfo:
        - vlName: "tracing"
          defaultUnderlyingIface: "trace"
          vid: "1001"
          ipInfo:
          - subnet: "10.107.136.0/23"
            role:
            - "Tracing"
            - "tracecontroller"
            ipAddress:
              oamext:
                rangeStart: "10.107.137.25"
                rangeEnd: "10.107.137.25"
              oamasm:
                rangeStart: "10.107.137.26"
                rangeEnd: "10.107.137.26"
              oamcm:
                rangeStart: "10.107.137.27"
                rangeEnd: "10.107.137.27"
              oamconfig:
                rangeStart: "10.107.137.28"
                rangeEnd: "10.107.137.28"
              oamfm:
                rangeStart: "10.107.137.29"
                rangeEnd: "10.107.137.29"
              oampm:
                rangeStart: "10.107.137.30"
                rangeEnd: "10.107.137.30"
              cpif:
                rangeStart: "10.107.137.31"
                rangeEnd: "10.107.137.31"
              cpcl:
                rangeStart: "10.107.137.32"
                rangeEnd: "10.107.137.32"
              cpnb:
                rangeStart: "10.107.137.33"
                rangeEnd: "10.107.137.33"
              cpnrt:
                rangeStart: "10.107.137.34"
                rangeEnd: "10.107.137.34"
              cpue:
                rangeStart: "10.107.137.35"
                rangeEnd: "10.107.137.35"
      policyRouteInfo:
        - gateway: "10.107.136.1"
          # - Description: the orderNumber of tracing route
          # Note: should different from orderNumber in the SCF file to avoid conflict
          orderNumber: "1000"
          # - Description: the table id of tracing route
          # recommend not to modify
          table: "249"
