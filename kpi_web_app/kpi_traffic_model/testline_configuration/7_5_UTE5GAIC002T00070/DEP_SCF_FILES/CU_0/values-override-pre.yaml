# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

aic-vcu-network:
  # Precondition: tenant's configuration is ready before deploy internal network
  # internal network
  internalNetwork:
  # Value range: string, no default value.
  # Note: This value need to match with the tenant's configuration. eg."ens1f1"
    internal:
      devicePool: "ens1f0"

  # - Description: the network interface device pool list, support link redundancy
  # - Note: if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  # - the fastPathDevicePool and slowPathDevicePoolBackup must not be same
  # - the slowPathDevicePool and slowPathDevicePoolBackup must not be same
  devicePoolList:
    # The SR-IOV Device Pool used by s1u,x2u,f1u,xnu,ngu networks (fast path)
    fastPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Backup Device Pool used by s1u-s,x2u-s,f1u-s,xnu-s,ngu-s networks (fast path),should be different with fastPathDevicePool
    fastPathDevicePoolBackup: ""
    # The SR-IOV Device Pool used by oam,tracing,f1c,x2c,xnc,ngc,internale1 networks (slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Device Pool used by oam-s,f1c-s,x2c-s,xnc-s,ngc-s networks (slow path),should be different with slowPathDevicePool
    slowPathDevicePoolBackup: ""

aic-vcu-pvc:
  # - Description: The parameters storageClassName and accessModes should be configured by the operator.
  # - Note:
  #     NCS multi-node, the storageClassName value should be "csi-cephfs", and the accessModes value should be "ReadWriteMany"
  #     NCS single node, the storageClassName value should be "dynamic-local-storage", and the accessModes value should be "ReadWriteOnce"
  #     OCP multi-node, the storageClassName value should be "ocs-storagecluster-cephfs", and the accessModes value should be "ReadWriteMany"
  #     OCP single node, the storageClassName value should be "localfs-lvm-sc", and the accessModes value should be "ReadWriteOnce"
  #     Other 3rd-party kubernetes platform, set the storageClassName and the accessModes according to the real scenario.
  #
  #   Simple rules:
  #     single node, the accessModes value should be "ReadWriteOnce", and specific the storageClassName
  #     multi-node, the accessModes value should be "ReadWriteMany", and specific the storageClassName which should support "ReadWriteMany"
  #
  #   Do not base on cnfLayout's value "basic" or "redundant" to select accessModes, due to some shared PVCs being used by more than two PODs.
  #
  #   The storageClassName in aic-vcu-cnf/values-override.yaml the same value as this one.

  storageClassName: &storageClassName "ocs-storagecluster-cephfs"
  accessModes: &accessModes "ReadWriteMany"

  logservice-pvc:
    syslog:
      storageClassName: *storageClassName
    auditlog:
      storageClassName: *storageClassName

  pm-pvc:
    hfrw:
      storageClassName: *storageClassName
    lfrw:
      storageClassName: *storageClassName

  rcpfm-pvc:
    storageClassName: *storageClassName

  cnum-pvc:
    accessModes: *accessModes
    storageClassName: *storageClassName

  rcpum-pvc:
    storageClassName: *storageClassName

  secret-storage-framework-pvc:
    vaultmanagerpvc:
      storageClassName: *storageClassName
    vaultserverpvc:
      storageClassName: *storageClassName

  certificate-management-pvc:
    certmantlsconfigpvc:
      accessModes: *accessModes
      storageClassName: *storageClassName
