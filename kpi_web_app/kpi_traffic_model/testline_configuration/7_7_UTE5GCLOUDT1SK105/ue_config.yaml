AppServer1: &APP_1                              # 1st application server definition
   address: '10.84.168.121'
  # address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.61'              # OPTIONAL ip of interface used for LTE data transfer
  # bind_interface_ip: '10.84.169.60'

UE_POOLS:
    TafUeAndroidPool:                   # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
        inline_config:
            ANDROID_UE_1:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor
                    serial_number: 'R3CN507BBHY'                                             # UE serial number (can be obtained via 'adb devices'
                    configuration:
                        ue_pc_address: 'PLKR-SG07-02.intra.noklab.net'
                        login: 'pzkrk'                # SSH login to UE PC
                        password: 'NokiaBts2003'               # SSH pass
                        qualcomm_prototype: TRUE
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
                        service_call_attach: '16'                              # OPTIONAL Service call which will be used for attaching UE
                        service_call_detach: '16'                              # OPTIONAL Service call which will be used for detaching UE

