UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                CAPABILITIES:                               # Capabilities that UE has. (as a list)
                    - REAL_UE
                  # - REAL_ANDROID_UE
                                                            # cell ID of 4G cell given by UE Manager concat "(NRBTS_ID)u16 + (lcrid)u8"
              # STARTING_CELL: 0x575501                     # here NRBTS_ID 22357 and lcrid = 1 for eNB 397 first cell
              # STARTING_CELL: 0x575502                     # here NRBTS_ID 22357 and lcrid = 2 for eNB 397 first cell
                STARTING_CELL: 0x575401                     # here NRBTS_ID 22356 and lcrid = 2 for eNB 398 second cell
                CLASS: AndroidUe                            # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '5d9865f'
                    configuration:                          # By Default ue key ('UE_FOR_TA' for this ue) is passed to construc as a name
                        chipset_NR5G_mode: 'SDX60'          # UE log collection way (SDX50 or SDX55 or SDX60 ...)
                        serial_com: '4'                   # COM_ID Obtained from qualcomm modem
                        diag_com: '7'
                        serial_baudrate: '11520'
                        os_version: 'windows'
                        ue_pc_ip: '10.0.116.210'            # UE PC IP address
                        pyro_port: '5059'                   # TCP Port number on UE PC on which Pyro server will be started
                        login: 'cyg_server'                 # SSH login to UE PC
                        password: 'Nokia@2018'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'        # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                                                            # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'
                                                            #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'
                                                            # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        data_transfer:                      # Application Server (for Iperf) details
                            iperf_path: '/data/data/com.nokia.syve.uemanager.mobile/'
                            iperf_interval: '5'             # Iperf interval in seconds (default: 1)
                          # app_servers:
                              # APP_1:
                            ssh:
                                host: '10.0.106.248'     # Application Server IP
                                user: 'ran5g'           # Application Server SSH login
                                password: 'nokia2018'   # Application Server SSH password
                            iperf_interface_ip: '10.11.70.155'
                                                            # Application Server interface used for data transfer
                                                            # (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.11.70.155'# Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'
                            iperf_options:
                                buffer: '2M'
                                qci:
                                    0: 34250                # use qci=0 keyword argument at Start Data Transfer for UL Xavier
                                    1: 34150                # use qci=1 keyword argument at Start Data Transfer for DL Xavier
                                packet: '1330B'             # -l iperf option
                                max_segment_size: '1460B'
                              # parallel_streams: '8'       #  Patch add by GBR to add as special option
