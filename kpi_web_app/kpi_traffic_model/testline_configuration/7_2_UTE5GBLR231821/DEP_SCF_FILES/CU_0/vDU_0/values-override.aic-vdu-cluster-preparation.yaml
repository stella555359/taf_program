# Default values for aic-vdu-cluster-preparation.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Description: oc user name. When userName is not null, it will add roles for oc user so that vDU can be deployed.
# Default value is an empty string.
userName: ""

# description: SecurityContextConstraints name. It will allow administrators to control permissions for pods.
# if sccName is "privileged", it won't create a new SCC, only bind privileged SCC to serviceaccounts.
# if sccName isn't "privileged" or not null, it will create a new SCC and bind new SCC to serviceaccounts.
# default value is "cnf5g"
sccName: "privileged"