UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            UE_Samsung:
                CAPABILITIES: # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 42                # Cell ID to which UE should attach  19220225
                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'R5CT513NBVD'             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_address: 'plkr-sc5g-ue7.intra.noklab.net'         # UE PC IP address 10.83.179.60
                        ue_pc_port: '80'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'user-lab0'                # SSH login to UE PC
                        password: 'Bts2003'               # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied (create empty directory on UE-PC)
                        server_python: 'C:/Users/user-lab0/AppData/Local/Programs/Python/Python36/python.exe'     # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/Users/user-lab0/Downloads/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        service_call_attach: '16'   # dla samsunga S22 dajemy tylko ten parametr i 16: service_call_attach:'16'
                        qcat_analyzer: 'QCAT Sample;Common Displays;Log Packet Summary'
                        voice_call_dialing_timeout: '30'  # Timeout for dialing (calling) state
                        qualcomm_prototype: 'yes'          # set to 'yes' if this is a Qualcomm prototype
                        network_mode_switch_method: 'adb' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        data_transfer:
                            iperf:
                                app_server: *APP_SERVER
                                binary_path: '/data/data/com.nokia.android.application/'

