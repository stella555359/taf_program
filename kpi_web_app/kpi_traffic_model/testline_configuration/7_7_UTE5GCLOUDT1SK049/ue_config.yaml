UE_POOLS:
    TafUeAndroidPool:                             # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'ce4da1b0'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_address: 'plkr-tp-ue92.p01.ska-lab.nsn-rdnet.net'   # UE PC IP address
                        login: 'plkrsg09'           # SSH login to UE PC
                        password: 'ssp123!!Macro'          # SSH password to UE PC
                        ue_pc_port: 80           # TCP Port number on UE PC on which Pyro server will be started
                        clear_logs: True            # to clear server logs always when the plugin starts
                        clear_server_files: True    # to clear server files always when the plugin starts
                        processes_to_kill: # processes to kill on UE PC - anything that may interrupt a test case
                          - 'uemanager'
                          - 'putty'
                        network_mode_switch_method: 'ADB'
                        data_transfer:
                            iperf:
                                app_server: *APP_3
                                interval: '1'
                                binary_path: '/data/data/com.nokia.android.application/'

