UE_POOLS:
  AndroidUePool:
    inline_config:
      UE_1: # UE name - change if you want
        CAPABILITIES: # Capabilities that UE has. (as a list)
          - REAL_UE
          - SMAWAVE_UE
        STARTING_CELL: 1 # Cell ID : gNB_I = 0x23169 concat  Cell_Id = 0x50
        CLASS: SMAwave # UE type is SMAwave so SMAwave class will be used
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
          serial_number: "CPX60P-AF220314WKT" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
          configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
            ue_pc_ip: "10.255.60.151" # GUI IP
            pyro_port: "8080" # TCP Port number on UE PC on which Pyro server will be started
            login: "root" # SSH login to UE PC
            password: "Ur1Gq7Yb2Dc3" # SSH password to UE PC
            server_dir: "/home/pi/pyro_server" # UE PC directory where all server files will be copied
            server_python:
              "python"
              # UE PC python location
            qcat_exe_path:
              ""
              #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
            diag_cfg_path:
              ""
              # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
            data_transfer: # Application Server (for Iperf) details
              ssh:
                host: "10.89.2.127" # Application Server IP
                user: "ute" # Application Server SSH login
                password: "UTE.debian12" # Application Server SSH password
              iperf_interface_ip:
                "10.202.10.1"
                # Application Server interface used for data transfer
                # (-B iperf parameter)
              # iperf_path: "/data/local/tmp/iperf/bin/iperf"
              ping:
                ping_host_ip: "10.89.2.127" # Remote host for ping (Start Data Transfer icmp protocol)
                ping_count: "10" # ping -c (count) option
                allowed_packet_loss: "5" # Allowed packet loss in %
      UE_2: # UE name - change if you want
          CAPABILITIES: # Capabilities that UE has. (as a list)
              - REAL_UE
              - SMAWAVE_UE
          STARTING_CELL: 1 # Cell ID : gNB_I = 0x23169 concat  Cell_Id = 0x50
          CLASS: SMAwave # UE type is SMAwave so SMAwave class will be used
          CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
              serial_number: "CPX60P-AF220259WKT" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
              configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                  ue_pc_ip: "10.255.60.152" # UE PC IP address
                  pyro_port: "8080" # TCP Port number on UE PC on which Pyro server will be started
                  login: "root" # SSH login to UE PC
                  password: "Dr7Sc1Pe2Gu8" # SSH password to UE PC
                  server_dir: "/home/pi/pyro_server" # UE PC directory where all server files will be copied
                  server_python:
                      "python"
                  # UE PC python location
                  qcat_exe_path:
                      ""
                  #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                  diag_cfg_path:
                      ""
                  # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                  data_transfer: # Application Server (for Iperf) details
                      ssh:
                          host: "10.89.2.135" # Application Server IP
                          user: "ute" # Application Server SSH login
                          password: "UTE.debian12" # Application Server SSH password
                      iperf_interface_ip:
                          "10.202.10.1"
                      # Application Server interface used for data transfer
                      # (-B iperf parameter)
                      # iperf_path: "/data/local/tmp/iperf/bin/iperf"
                      ping:
                          ping_host_ip: "10.89.2.135" # Remote host for ping (Start Data Transfer icmp protocol)
                          ping_count: "10" # ping -c (count) option
                          allowed_packet_loss: "5" # Allowed packet loss in %
