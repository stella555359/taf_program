AppServer1: &APP_1
   address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.60'
   expected_prompt: '5g@SKA-HC14-15-AppServer2:.*\$\s+'

UE_POOLS:
  TafUeAndroidPool:
    inline_config:
      UE: # UE name - change if you want
         CAPABILITIES: # Capabilities that UE has. (as a list)
          - REAL_UE
          - REAL_ANDROID_UE
          - SAMSUNG
         STARTING_CELL: 1 # Cell ID : gNB_I = 0x23169 concat  Cell_Id = 0x50
         CLASS: AndroidUe # UE type is Android so AndroidUe class will be used
         CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
            serial_number: "R5CT34DN7AP" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
            configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
              ue_pc_address: 'PLKR-SG01-07.intra.noklab.net'    # UE PC IP address
              login: 'pzkrk'              # SSH login to UE PC
              password: 'NokiaBts2003'    # SSH password to UE PC
              ue_pc_port: '8080'
              service_call_attach: '16'
              service_call_detach: '16'
              network_mode_switch_method: 'ADB'       # method for change network mode keyword
              data_transfer: # Application Server (for Iperf) details
                iperf:
                  app_server: *APP_1
                  interval: '1'           # Iperf interval in seconds (default: 1)
                  binary_path: '/data/data/com.nokia.android.application/'
                  interface_name: rmnet_data0
