    address: '10.83.249.132'
    user: '5g'
    password: '5g'
    bind_interface_ip: '10.83.249.162' # IP of interface used for data transfer
    expected_prompt: '5g@KRK-SB18s16-App2'

UE_POOLS:
    TafUeAtPool:  # UE Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with `Require UE` keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
#                    com_port: 'X'        # number of COM port supporting AT commands
                    configuration:
                        ue_pc_address: 'PLKR-SC5G-PC113.intra.noklab.net'      # UE PC domain address or IP
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        ue_pc_port: 80                               # OPTIONAL, defaults to 80 (taf.ue.proxy)
#                        proxy_mngr_port: 9955
                        ue_pc_expected_prompt: 'pzkrk@PLKR-SC5G-PC113:~$'         # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-SC5G-PC113:~$'
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 3'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                                binary_path: '/usr/bin/'
                                version: '3'
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
