# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

# - Description: Host VLAN network or Guest VLAN network. Support value: HOST and GUEST
# - Default value: GUEST
bipVlanMode: "GUEST"
f1VlanMode: "GUEST"
f1cVlanMode: "GUEST"
fhmVlanMode: "GUEST"
fhucVlanMode: "GUEST"
oamVlanMode: "GUEST"
tracingVlanMode: "GUEST"
externalSyscomVLANMode: "GUEST"

# - Description: device Pool List
# - Note: need to be filled accoring to the real environment!!!
devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_ens93f2"
    # The SR-IOV Device Pool used by oam/tracing/f1c networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_ens93f2"
    # The SR-IOV Device Pool used by l1up networks (fast path)
    fastPathRanNicPool: "nokia.com/sriov_rinline_up"
    # The SR-IOV Device Pool used by l1cp networks (slow path)
    slowPathRanNicPool: "nokia.com/sriov_rinline_cp"

# Define the VLAN ID for Host VLAN mode
VlanID:
  l1bip: ""
  l2bip: ""
  oam: ""
  f1: ""
  f1c: ""
  fhm: ""
  fhuc: ""
  tracing: ""
  externalSyscom: ""
