UE_POOLS:
    AndroidUePool:
        inline_config:
            UE1:                                    # UE name - change if you want
                CAPABILITIES: # Capabilities that UE has. (as a list)
                    - Legacy_1
                STARTING_CELL: 262400                    # Cell ID to which UE should attach
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS: 
                    imei: 355819291339152
                    device_id: Nokia X20
                    serial_number: 'AQKSLVH002N33100483'
                    configuration:
                        uc_server_Ip: '10.41.209.103'       #ultracaller server IP
                        token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Im9yYW4iLCJhZG1pbiI6IiJ9.zWZkMzVkfZdWW_YJSBYH-3IG52qeGCfw-7ZpJRnPh3I'  # ultracaller server token
                        ue_pc_ip: '10.45.150.208'        # UE PC IP address
                        login: 'inbabtslabuser'                  # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'              # SSH password to UE PC
                        cid: '1'
                        clear_logs: 'yes'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
