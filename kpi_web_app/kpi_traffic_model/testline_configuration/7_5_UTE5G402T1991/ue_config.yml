---
UE_POOLS:
    AndroidUePool:
        inline_config:
            # UE name - change if you want
            UE_1:
                # Capabilities that UE has. (as a list)
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                # Cell ID to which UE should attach
                STARTING_CELL: 0x275B01

                # UE type is Qualcomm so QualcommUe class will be used
                CLASS: AndroidUe
                # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                CONSTRUCTOR_PARAMETERS:
                    # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    serial_number: '9YS0220707031544'
                    # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                    configuration:
                        com_port: '1'                   # Diagnostic COM ID
                        ue_pc_ip: '10.97.78.80'         # UE PC IP address
                        ue_pc_prompt: '.*SDT2>'     # UE PC ssh prompt
                        ue_pc_host: '10.97.78.80'       # UE PC IP address
                        # TCP Port number on UE PC on which Pyro server will be started
                        pyro_port: '9090'
                        login: 'SDT2'             # SSH login to UE PC
                        password: 'Nokia@123'         # SSH password to UE PC
                        server_dir: 'C:/tool/PyroAsService'
                        server_python: 'C:/Python27/python.exe'
                        # PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        qcat_exe_path: >
                          C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe
                        # PATH to DIAG.cfg file on UE PC (required to filter QCT messages)
                        diag_cfg_path: >
                          C:/pyro_server/DIAG.cfg
                        clear_server_files: 'yes'
                        # Timeout for dialing (calling) state
                        voice_call_dialing_timeout: '30'
                        # set to 'yes' if this is a Qualcomm prototype
                        qualcomm_prototype: 'no'
                        # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        network_mode_switch_method: 'adb'
                        # ue type [LINUX, ANROID] - determines way of data transfer handling
                        # Android - iperf on ue, Linux iperf on UE_PC (use of QMICM, UE as a modem)
                        ue_type: 'LINUX'
                        # 'C:\ue_pc_server\tools\iperf\iperf.exe' or
                        # '/data/data/com.magicandroidapps.iperf/bin/iperf' or
                        # path to iperf app on UE
                        iperf_adb_dir: >
                          C:\tool\iPerfGui+\iperf.exe
                        licence_type: '5G'
                        # phrases based on which processes names will be found and killed before test
                        #processes_to_kill:
                        #    - 'putty'
                        #    - 'QXDM'
                        #    - 'adb'
                        #    - 'iperf'
                        #    - 'QPSTConfig'
                        #    - 'QMITestPro'

                        port_dict:
                            # [OPTIONAL] Port for heartbeat messages
                            heartbeat: 6005
                            # [OPTIONAL] Port for command input
                            server_command_input: 6007
                            # [OPTIONAL] Port for QXDM messages output
                            server_qxdm_messages: 6008
                            # [OPTIONAL] Port for server command output
                            server_command_output: 6009
                            # [OPTIONAL] Port for RRC messages stream (source
                            # for ta_messaging), requires ue_pc_server started
                            # with message stream
                            message_stream_port: 6010

                        # Application Server (for Iperf) details
                        data_transfer:
                            # Static IP allocated to UE
                            ue_static_ip: '10.107.49.101'
                            # from PMaron - do not know to which ip address is correspond - lte_network_ip: '10.14.49.141'
                            lte_network_ip: '10.68.141.142'
                            ssh:
                                # Application Server IP
                                host: '10.68.169.24'
                                # Application Server SSH login
                                user: 'ute'
                                # Application Server SSH password
                                password: 'ute'
                            # Application Server interface used for data transfer (-B iperf parameter)
                            iperf_if_ip: '10.97.78.80'
                            ping:
                                # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_host_ip: '10.70.62.33'
                                # ping -c (count) option
                                ping_count: '10'
                                # Allowed packet loss in %
                                allowed_packet_loss: '5'
    QualcommUePool:
        inline_config:
            # UE name - change if you want
            UE_1:
                # Capabilities that UE has. (as a list)
                CAPABILITIES:
                    # - REAL_UE
                    - REAL_QUALCOMM_UE
                # Cell ID to which UE should attach
                STARTING_CELL: 0x566107

                # UE type is Qualcomm so QualcommUe class will be used
                CLASS: QualcommUe
                # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                CONSTRUCTOR_PARAMETERS:
                    # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    serial_number: '10822f15'
                    # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                    configuration:
                        com_port: '4'                   # Diagnostic COM ID
                        AT_port: 'COM4'                 # Diagnostic COM ID
                        ue_pc_ip: '10.14.63.92'         # UE PC IP address
                        ue_pc_prompt: '.*cv5g2_2> '     # UE PC ssh prompt
                        ue_pc_host: '10.14.63.92'       # UE PC IP address
                        login: 'cv5g2_2'                # SSH login to UE PC
                        password: 'L@urent5G'           # SSH password to UE PC
                        IMEI: '359403100042459'         # Askey IMEI
                        IMSI: '540019000000144'         # Askey IMSI
                        # TCP Port number on UE PC on which Pyro server will be started
                        pyro_port: '9090'
                        # UE PC directory where all server files will be copied
                        server_dir: 'C:/UE_manager/ue_manager_files/pyro_server'
                        server_python: 'C:/Python27/python.exe'
                        server_python3: 'C:/Python38/python.exe'
                        # PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        qcat_exe_path: >
                          C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe
                        # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        diag_cfg_path: >
                          C:/UE_manager/ue_manager_files/pyro_server/DIAG.cfg
                        # Timeout for dialing (calling) state
                        voice_call_dialing_timeout: '30'
                        # set to 'yes' if this is a Qualcomm prototype
                        qualcomm_prototype: 'yes'
                        # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        network_mode_switch_method: 'adb'
                        # ue type [LINUX, ANROID] - determines way of data transfer handling:
                        # Android: iperf on ue, Linux: iperf on UE_PC (use of QMICM, UE as a modem)
                        UE_Type: 'LINUX'
                        # 'C:\ue_pc_server\tools\iperf\iperf.exe' or
                        # '/data/data/com.magicandroidapps.iperf/bin/iperf' or
                        # path to iperf app on UE
                        iperf_adb_dir: >
                          /data/data/com.magicandroidapps.iperf/bin/iperf
                        licence_type: '5G'
                        # phrases based on which processes names will be found and killed before test (case insensitive)
                        #processes_to_kill:
                        #    - 'putty'
                        #    - 'QXDM'
                        #    - 'adb'
                        #    - 'iperf'
                        #    - 'QPSTConfig'
                        #    - 'QMITestPro'

                        port_dict:
                            # [OPTIONAL] Port for heartbeat messages
                            heartbeat: 6005
                            # [OPTIONAL] Port for command input
                            server_command_input: 6007
                            # [OPTIONAL] Port for QXDM messages output
                            server_qxdm_messages: 6008
                            # [OPTIONAL] Port for server command output
                            server_command_output: 6009
                            # [OPTIONAL] Port for RRC messages stream (source for ta_messaging),
                            # requires ue_pc_server started with message stream
                            message_stream_port: 6010

                        # Application Server (for Iperf) details
                        data_transfer:
                            # Static IP allocated to UE
                            ue_static_ip: '172.60.1.205'
                            # Static IP allocated to not connected ASKEY UE
                            ueIpDetach: '172.20.168.155'
                            # Static IP allocated to connected ASKEY UE
                            ueIpAttach: '172.60.1.205'
                            # from Ph.Maron - do not know to which ip address is correspond - lte_network_ip: '10.14.49.141'
                            lte_network_ip: '10.14.49.141'
                            ssh:
                                # Application Server IP
                                host: '10.14.42.190'
                                # Application Server SSH login
                                user: 'ran5g'
                                # Application Server SSH password
                                password: 'nokia2018'
                            # Application Server interface used for data transfer (-B iperf parameter)
                            iperf_if_ip: '10.11.70.77'
                            ping:
                                # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_host_ip: '10.11.70.77'
                                # ping -c (count) option
                                ping_count: '10'
                                # Allowed packet loss in %
                                allowed_packet_loss: '5'
