  expected_prompt: '5g@KRK-SB18s16-App4'


UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '11'       # number of com port supporting AT commands
                    configuration:
                        ue_pc_address: 'plkr-sg07-30.intra.noklab.net'        # UE PC domain address or IP
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        ue_pc_port: 80
                        proxy_mngr_port: 9955                                        # OPTIONAL, default is 80
                        ue_pc_expected_prompt: 'plkr-sg07-30'           # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-SG07-30'
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 3'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1

