AppServer1: &APP_1
   address: '10.45.168.53'
   user: 'syslab'
   password: 'system'
   bind_interface_ip: '10.45.168.53'

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            UE_1:
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - NR_L3_CALL
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:
                    serial_number: '7017f150'
                    configuration:
                        ue_pc_address: '10.44.72.117'
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: 1
                        ue_pc_port: '80'

ATTENUATORS:
    TopYoung:                               # attenuator name - change if you want
        TYPE: TopYoung                      # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        VENDOR: TopYoung
        MODEL: TAS_24T24_04G6_90_1S_EJS
        CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.66.196'              # IP address of attenuator device
            port: 3001                      # TCP Port number of attenuator device
            min_attenuation: 0              # 0dB
            max_attenuation: 90             # 95dB


CELLS_ATTENUATION:
    AVQA_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 1
            - 2
            - 3
            - 4
    AVQA_2:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 5
            - 6
            - 7
            - 8
    AHPB_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 9
            - 10
            - 11
            - 12
    AHPJ_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 13
            - 14
            - 15
            - 16
