heat_template_version: 2016-10-14
description: Template to create network interface

parameters:
  index:
    type: number
    default: 0
  networks:
    type: json
  role:
    type: string
    description: Usage role for the port
    default: internal
    constraints:
    - allowed_values: [internal, external, oam]
  mtu:
    type: number
    description: MTU value for the port
    default: 1400
    constraints:
    - range: {min: 1280, max: 9000}
  pmtu:
    type: number
    description: Maximum MTU value supported by the port, i.e. provider network MTU
    default: 9000
    constraints:
    - range: {min: 1280, max: 9000}
  name_prefix:
    type: string
    description: Prefix name of ports
  port_property:
    description: Type specific port parameters
    type: json
    default:
      virtio: normal
      avp:    normal
      sriov:  direct
  vnfindex:
    description: count of oam vm
    type: number

resources:
  port:
    type: OS::Neutron::Port
    properties:
      name:
        str_replace:
          template: $prefix-$name
          params:
            $prefix: {get_param: name_prefix}
            $name: {get_param: [networks, {get_param: index}, name]}
      network: {get_param: [networks, {get_param: index}, uuid]}
      binding:vnic_type: { get_param: [port_property, {get_param: [networks, {get_param: index}, port_type]}]}

outputs:
  ip_address:
    value: {get_attr: [port, fixed_ips, 0, ip_address]}
  gw_address:
    value: {get_attr: [port, subnets, 0, gateway_ip]}
  port:
    value: {get_resource: port}
  ip-ext-info:
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>: [{get_param: [networks, {get_param: index}, name]}]
          template:
            ip-info.<%name%>.mac: {get_attr: [port, mac_address]}
            ip-info.<%name%>.role: {get_param: role}
            ip-info.<%name%>.ip_addrs:
            ip-info.<%name%>.mtu:
              str_replace:
               template: <%mtu%>
               params:
                 #<%mtu%>: {get_param: mtu}
                 <%mtu%>: {get_param: [networks, {get_param: index}, mtu]}
            ip-info.<%name%>.provider-network-mtu:
              str_replace:
               template: <%pmtu%>
               params:
                 #<%pmtu%>: {get_param: pmtu}
                 <%pmtu%>: {get_param: [networks, {get_param: index}, pmtu]}
            ip-sid-info.<%name%>.ip_addrs:
              str_replace:
               template: <%ip%>
               params:
                 <%ip%>: {get_param: [networks, {get_param: index}, ip, {get_param: vnfindex}]}
            ip-sid-info.<%name%>.sid:
              str_replace:
               template: <%sid%>
               params:
                 <%sid%>: {get_param: [networks, {get_param: index}, sid]}
