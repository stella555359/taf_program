pdn_1: &pdn_1
    entryName: '5gsakrk'           # This field is required, it defines name under which its stored on UE
    apnName: '5gsakrk'             # This field is required, its the apn address (could be "apn" also)
    authType: NONE
    operatorNumeric: '00101'
    carrierEnabled: True
    apnType:                        # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible         types: CBS, DEFAULT,DUN, EMERGENCY, FOTA, HIPRI, IA, IMS, MCX, MMS, SUPL, XCAP
        - IA
        - DEFAULT
    protocol: 'IPV4V6'
    roamingProtocol: 'IPV4V6'

pdn_2: &pdn_2
    entryName: '5gkrk'           # This field is required, it defines name under which its stored on UE
    apnName: '5gkrk'             # This field is required, its the apn address (could be "apn" also)
    authType: NONE
    operatorNumeric: '00101'
    carrierEnabled: True
    apnType:                        # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible         types: CBS, DEFAULT,DUN, EMERGENCY, FOTA, HIPRI, IA, IMS, MCX, MMS, SUPL, XCAP
        - IA
        - DEFAULT
    protocol: 'IPV4V6'
    roamingProtocol: 'IPV4V6'

AppServer1: &APP_1                              # 1st application server definition
   address: '10.84.168.121'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.61'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@SKA-HC14-16-AppServer2'

UE_POOLS:
    TafUeAtPool:                   # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
        inline_config:
            QUECTEL_UE:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: AtUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor
                    com_port: '46'
                    configuration:
                        ue_pc_port: 8080
                        pdns:                                                   # OPTIONAL
                            default: *pdn_1
                            emergency: *pdn_2                                   # OPTIONAL
                        ue_pc_address: 'PLKR-SG07-16.intra.noklab.net'
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'               # SSH pass
                        ue_pc_expected_prompt: 'pzkrk@PLKR-SG07-16$'
                        expected_prompt: 'pzkrk@PLKR-SG07-16$'
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                                interface_name: 'Cellular 17'
                                dt_from_uepc: True
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
