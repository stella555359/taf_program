# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

# - Description: the directory for hostpath volume to storage the coredump info
# - Note: the default value of coredumpPath is set to "", means coredump will not be saved
# -       this config is for internal troubleshooting if set to host path
# -       example: coredumpPath: &coredumppath "/tmp/cdump"
coredumpPath: &coredumppath ""
# - Description: securityContext configuration for vCU uid/gid/groups
securityContext:
  # - Description: Define the uid and gid for pod, uid/gid with non zero the container start with
  #     non-root user, if the uid/gid is zero will start with root user.
  uid: &uid 9999
  gid: &gid 9999
  # - Description: Define the group of mounted volumes for pod, containers started with non-root
  #     need to make sure their gid can access expected volume.
  groups: &groups 9999

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: registry of image
  # - Support Value: "bcmt-registry:5000/dep" for NCS, "registry.kube-system.svc.nokia.net:5555/dep" for NCIR,  image-registry.openshift-image-registry.svc:5000/<namespace> for ocp
  image:
    registry: "image-registry.openshift-image-registry.svc:5000/cran2"

  # timezone
  timezone: "Asia/Shanghai"

  # - Description: the number of CPUE Pods. If cnfLayout is basic, [1, 4] is officially supported; if cnfLayout is redundant, [2, 4] is officially supported.
  # - Note: If cnfLayout is redundant and cpuecount is 1, it will be modified to 2 automatically.
  cpuecount: 1
  # - Description: the number of UPUE Pods. If cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
  # - Note: If cnfLayout is redundant and upuecount is 1, it will be modified to 2 automatically.
  upuecount: 1

  # - Description: Define the minimum number of these N+ Pods to support the capacity requirement of the operator. Currently during startup, vCU checks if the threshold (MIN_CAPACITY_CPUE/MIN_CAPACITY_UPUE)is met. In case the threshold is not met, the capacity reduction alarm is posted. This functionality is also applied during run-time.
  #   For minCapacityCPUE, if cnfLayout is basic, [1, 4] is officially supported; if cnfLayout is redundant, [2, 4] is officially supported.
  #   For minCapacityUPUE, if cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
  # - Note: If cnfLayout is redundant and minCapacityCPUE or minCapacityUPUE is 1, it will be modified to 2 automatically.
  # - Feature ID: CB007467-F,CB007890
  # - Default value: 1
  minCapacityCPUE: 1
  minCapacityUPUE: 1

  # - Description: the layout of the CU. Redundant means CU supports high availability.
  # - Support Value: basic or redundant
  cnfLayout: "basic"

  # - Description: the name of RuntimeClass which is used for high performance
  # - Default value: "nokia-performance"
  highPerformanceRunTimeClass: "nokia-performance"

  # - Description: Source name of vCU for data monitor, show the Unique Identification of vCU
  siteDescription: "gNB5G"

  # - Description:
  #   the sriov interface device pool list include fast path and slow path, support link redundancy
  # - Note:
  #     if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  #     all the deivepool values should same as the values in aic-vcu-prerequisite/values-override.yaml
  # - Support values:
  #   get values by command "kubectl describe node|grep "Allocatable:" -A 10|grep sriov"
  #   fastPathDevicePool and fastPathDevicePoolBackup which need dpdk bdnd
  #   fastPathDevicePool and fastPathDevicePoolBackup examples as followed:
  #     - for Intel NIC which support host dpdk bond, should include "vfio" e.g  openshift.io/sriov_vfio_ens9f0
  #     - for Mellanox NIC which not support host dpdk bond, e.g openshift.io/sriov_netdevice_ens34f0
  #   slowPathDevicePool and slowPathDevicePoolBackup which don't need dpdk bond, examples as followed:
  #     - openshift.io/sriov_netdevice_ens34f0
  devicePoolList:
    # The SR-IOV Device Pool used by s1u,x2u,f1u,xnu,ngu networks (fast path)
    fastPathDevicePool: "openshift.io/sriov_netdevice_ens25f0"
    # The SR-IOV Backup Device Pool used by s1u-s,x2u-s,f1u-s,xnu-s,ngu-s networks (fast path),should be different with fastPathDevicePool
    fastPathDevicePoolBackup: "openshift.io/sriov_netdevice_ens25f1"
    # The SR-IOV Device Pool used by oam,tracing,f1c,x2c,xnc,ngc,internale1 networks (slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_ens25f0"
    # The SR-IOV Device Pool used by oam-s,f1c-s,x2c-s,xnc-s,ngc-s networks (slow path),should be different with slowPathDevicePool
    slowPathDevicePoolBackup: "openshift.io/sriov_netdevice_ens25f1"

  # - Description: external network configuration for each network interface
  #   List of parameters for each network interface
  # -------------------------------------------------------------------------------------------------------------
  # | key                    | description                                                                      |
  # -------------------------------------------------------------------------------------------------------------
  # | vlName                 | VLAN interface name for which modification is not recommended                    |
  # -------------------------------------------------------------------------------------------------------------
  # | defaultUnderlyingIface | default underlying Ethernet interface for which modification is not recommended  |
  # -------------------------------------------------------------------------------------------------------------
  # | secUnderlyingIface     | secondary underlying Ethernet interface for which modification is not recommended|
  # -------------------------------------------------------------------------------------------------------------
  # | vid                    | VLAN ID                                                                          |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty  |
  # -------------------------------------------------------------------------------------------------------------
  # | rangeStart             | start IP address in the IP range which can be IPv4 or IPv6                       |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                  |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty  |
  # -------------------------------------------------------------------------------------------------------------
  # | rangeEnd               | end IP address in the IP range which can be IPv4 or IPv6                         |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty  |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                  |
  # |                        | - for interfaces s1u/x2u/ngu/f1u/xnu                                             |
  # |                        |   if "upuecount" = 1, the "rangeEnd" should be same as "rangeStart"              |
  # |                        |   if "upuecount" > 1, the ip address count of range between "rangeStart"         |
  # |                        |   and "rangeEnd" should equal "upuecount"                                      |
  # |                        | - for interfaces f1c/x2c/xnc/ngc/oam/tracing                                     |
  # |                        |   the "rangeEnd" should be same as "rangeStart"                                  |
  # -------------------------------------------------------------------------------------------------------------
  # | subnet                 | the subnet of the network which can be ipv4 or ipv6                              |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty  |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0/24"),IPv6 FORMAT(e.g. "2001:db8::0/112")             |
  # -------------------------------------------------------------------------------------------------------------
  # | role                   | IP role for the IP address                                                       |
  # -------------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
      - vlName: "oamvlan"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: "87"
        ipInfo:
        - rangeStart: "10.110.233.101"
          rangeEnd: "10.110.233.101"
          subnet: "10.110.233.96/28"
          role:
          - "oam"
          - "certman-server"
          - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.110.233.97"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
