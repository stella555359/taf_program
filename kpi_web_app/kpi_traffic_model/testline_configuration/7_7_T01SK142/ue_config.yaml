UE_POOLS:
  TafUeAtPool:                         # Ue Pool class defined by library
    inline_config:
      QuectelUE:                        # UE name
        CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
          - REAL_UE_FR1
        CLASS: Quectel
        CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
          configuration:
            ue_pc_address: 'plkr-tp-ue75.p01.ska-lab.nsn-rdnet.net'      # UE PC domain address or IP
            ue_pc_login: 'plkrsg09'
            ue_pc_password: 'ssp123!!Macro'
            proxy_mngr_port: '9955'
            ue_pc_expected_prompt: 'plkrsg09@PLKR-TP-UE75 ~'    # OPTIONAL but if you want to run dt from ue pc interface is mandatory
            data_transfer:                                        # data transfer protocols
              iperf:
                app_server: *APP_SERVER_1
                interval: 1                                   # OPTIONAL, default is 80
                server_close_delay: 50
                binary_path: '/cygdrive/c/iperf/'
                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
              ping:
                app_server: *APP_SERVER_1
                interval: 1
              ftp:
                app_server: *APP_SERVER_1
  TafUeAndroidPool:
    inline_config:
      ANDROID_UE_1: # UE name - change if you want (but better not)
        CAPABILITIES:
          - REAL_UE_FR2
        CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
          serial_number: 'R5CT515ZNYZ'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
          configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
            ue_pc_address: 'PLKR-TP-UE82.intra.noklab.net'          # UE PC IP address
            ue_pc_login: 'plkrsg09'                 # SSH login to UE PC
            ue_pc_password: 'ssp123!!Macro'         # SSH password to UE PC
            proxy_mngr_port: '9955'
            clear_logs: True
            service_call_attach: '16'                              # OPTIONAL Service call which will be used for attaching UE
            service_call_detach: '16'
            network_mode_switch_method: 'ADB' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
            data_transfer: # Application Server (for Iperf) details
               iperf:
                 app_server: *APP_SERVER_1
                 interval: '1'           # Iperf interval in seconds
                 binary_path: '/data/data/com.nokia.android.application/'
                 interface_name: '5gbothkrk/rmnet_data0'
