    address: '10.84.168.70'
    user: '5g'
    password: '5g'
    bind_interface_ip: '10.84.169.54'
    expected_prompt: '5g@SKA-HC14s17-1:.*\$\s+'

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'cc06033f'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_address: 'plkr-vici-01.p01.ska-lab.nsn-rdnet.net'    # UE PC IP address
#                        ue_pc_address: '10.84.174.6'
                        login: 'user-lab0'            # SSH login to UE PC
                        password: 'Bts2003'         # SSH password to UE PC
                        ue_pc_port: '8080'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: '1'
                                binary_path: '/data/user/0/com.nokia.android.application/'
