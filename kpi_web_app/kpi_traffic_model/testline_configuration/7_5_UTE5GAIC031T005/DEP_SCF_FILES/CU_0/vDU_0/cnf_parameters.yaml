# if scc_name is not configured, will install scc chart with privileged.
# if scc_name is configured, the name rule must be followed: a lowercase RFC 1123 subdomain must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character (e.g. 'example.com', regex used for validation is '[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*')
scc_name:  privileged
# You need to set the "l2nrtCount" and "l2rtCount" to non-zero on Vran4.0.
l2rtCount: 1
l2nrtCount: 1
vlan:
  oam: 216
  f1: 215
  l1bip: 212
  l2bip: 213
  internal_range: 211-211
  tracing: 214
network:
  fastPathCommonPool: openshift.io/sriov_vfio_0
  slowPathCommonPool: openshift.io/sriov_netdevice_0
  fastPathRANNICPool: nokia.com/sriov_rinline_up
  slowPathRANNICPool: nokia.com/sriov_rinline_cp
  f1usubnet: 10.56.9.104/28
  f1csubnet: 10.56.9.104/29
  f1subnet: 10.56.9.104/28
  oamsubnet: 10.56.9.112/29
  oam_ordernumber: 5
  tracingsubnet: 10.56.9.96/29
  tracing_ordernumber: 1000
misc:
  pvc_name: vduxiaomei
  fecVFNum: 1
  timezone: Asia/Shanghai
  platform_type: OCP
  access_mode: ReadWriteOnce
  l1hi_dedicated_core: 6

  # you can get it by command "kubectl get storageclasses.storage.k8s.io“
  storage_class_name: localfs-lvm-sc
  deployment_type: OE20
  l2rtDeploymentType: OE20_MEDIUM_CAP
  l2nrtDeploymentType: OE20_MEDIUM_CAP
  upCellFlag: single
  upActiveSiblingCore: false
cloudRanVersion: 4.0
