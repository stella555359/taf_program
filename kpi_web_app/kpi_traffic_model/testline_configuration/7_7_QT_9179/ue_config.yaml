UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library
        inline_config:
            COM18:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                CLASS: AtUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '8'        # number of com port supporting AT commands
                    configuration:
                        ue_pc_address: 'PLKR-TP-UE30.intra.noklab.net'      # UE PC domain address or IP
                        ue_pc_login: 'plkrsg09'
                        ue_pc_password: 'ssp123!!Macro'
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        ue_pc_expected_prompt: 'plkrsg09@PLKR-TP-UE37'    # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular'                  # OPTIONAL   <- trzeba sprawdziæ na którym interfejsie jest adres po attachu
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
            COM19: # UE name
                CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE2
                CLASS: AtUe
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '8'        # number of com port supporting AT commands
                    configuration:
                        ue_pc_address: 'PLKR-TP-UE30.intra.noklab.net'      # UE PC domain address or IP
                        ue_pc_login: 'plkrsg09'
                        ue_pc_password: 'ssp123!!Macro'
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        ue_pc_expected_prompt: 'plkrsg09@PLKR-TP-UE37'    # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        data_transfer: # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_2
                                interval: 1
                                interface_name: 'Cellular'                  # OPTIONAL   <- trzeba sprawdziæ na którym interfejsie jest adres po attachu
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_2
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_2
