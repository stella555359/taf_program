# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

#########################################################
# top level configuration private to sub charts
#########################################################

global:
  # - Description: the accessModes of persistent volume.
  #   OCP multi node: ReadWriteMany
  #   OCP single node: ReadWriteOnce
  accessModes: "ReadWriteOnce"
  # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
  # - Values:
  #    OCP multi node: ocs-storagecluster-cephfs
  #    OCP single node: lvms-vg1
  # - Note:
  #     The storageClassName in aic-vdu-cnf/values-override.yaml should be same value as this one.
  storageClassName: "lvms-vg1"

  image:
    # - Description: registry of image
    # - Default Value: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP
    # - Note: For OCP internal image registry, it contains the namespace, {{ .Release.Namespace }} would be translated into actual namespace.
    registry: srnclab1057lcm.srnblr.nsn-rdnet.net:8443/ccr

  # - Description: Assigning pods to specific nodes. node labels must be pre-defined in advance.
  # - Support Value: key-value pair. eg {nokia: winner}
  nodeSelector: {}

# - Description: sub chart aic-intnet private configuration
aic-intnet:
  # - Description: Host VLAN network or Guest VLAN network. Support value: HOST and GUEST
  # - Default value: GUEST
  # - Note: L1UP only support GUEST mode, L1CP no VLAN configuration
  bipVlanMode: "GUEST"
  f1VlanMode: "GUEST"
  f1cVlanMode: "GUEST"
  fhmVlanMode: "GUEST"
  oamVlanMode: "GUEST"
  tracingVlanMode: "GUEST"

  # - Description: device Pool List
  # - Note: need to be filled according to the real environment!!!
  devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_1"
    # The SR-IOV Device Pool used by f1s networks (fast path), which is backup of fastPathCommonPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with fastPathCommonPool
    fastPathCommonPoolBackup: ""
    # The SR-IOV Device Pool used by oam/tracing/f1c/fhm/twamp networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_1"
    # The SR-IOV Device Pool used by oams/f1cs/twamps networks (slow path),which is backup of slowPathCommonPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with fastPathCommonPool
    slowPathCommonPoolBackup: ""
  # Define the VLAN ID for Host VLAN mode
  # - Note: no VLAN for L1CP, and VLAN 100, 200 hard coded for L1UP and L1UP trace
  VlanID:
    l2bip: ""
    oam: ""
    f1: ""
    f1c: ""
    fhm: ""
    tracing: ""

# - Description: sub chart aic-pvc private configuration
aic-pvc:
  # - Description: the name of persistent volume
  # -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
  pvcName: "vdupvc"

# - Description: sub chart aic-vdu-rbac private configuration
# aic-vdu-rbac:
