   address: '10.84.168.120'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.60'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@SKA-HC14-15-AppServer'

UE_POOLS:
    TafUeAtPool:                   # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
        inline_config:
            QUECTEL_UE:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:                     # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    configuration:
                        ue_pc_address: 'PLKR-SG07-15.intra.noklab.net'
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        login: 'pzkrk'                # SSH login to UE PC
                        password: 'NokiaBts2003'               # SSH pass
                        proxy_mngr_port: 9955                          # taf.ue.proxy.mngr support Quectel UEs
                        ue_pc_expected_prompt: 'pzkrk@PLKR-SG07-15'         # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-SG07-15'
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                                interface_name: 'Cellular 3'            # OPTIONAL
                                dt_from_uepc: True                      # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
