ATTENUATORS:
    RadioRack08:                                      # attenuator name - change if you want
        TYPE: RadioRack                               # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.hytem.HytemAttenuator
        CONSTRUCTOR_PARAMETERS:                       # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.83.185.240'                       # IP address of attenuator device
            port: 50000                               # TCP Port number of attenuator device
            min_attenuation: 0
            max_attenuation: 220

