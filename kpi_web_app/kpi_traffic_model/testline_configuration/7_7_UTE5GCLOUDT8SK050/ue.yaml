UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            OnePlus:
                CAPABILITIES:
                    - REAL_ANDROID_UE
                    - COMMERCIAL
                    - REAL_SAMSUNG_UE
                STARTING_CELL: '323789060'
                STARTING_CELL_5G_PCI: 260
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'R5CT915AXMW'
                    configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_address: '10.84.129.87'
                        login: 'pzkrk'                # SSH login to UE PC
                        password: 'NokiaBts2003'               # SSH password to UE PC
                        # ue_pc_port: '8080'
                        proxy_mngr_port: '9955'
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/Users/user-lab0/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        voice_call_dialing_timeout: '30'  # Timeout for dialing (calling) state
                        network_mode_switch_method: 'adb' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: '1'           # Iperf interval in seconds (default: 1)
                                binary_path: '/data/data/com.nokia.android.application/'
