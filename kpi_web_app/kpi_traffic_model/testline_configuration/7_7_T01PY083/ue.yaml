AppServer1: &APP_1                              # 1st application server definition
   address: 'SRN-Appserver-Krakow.net.krk-lab.nsn-rdnet.net'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.83.249.189'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@SRN-Appserver-Krakow:~$'        # OPTIONAL regex that should match prompt on App Server
UePC1: &UE_PC_1
  ue_pc_address: 'PLKR-SG01-40.intra.noklab.net'    # UE PC IP address
  ue_pc_login: 'NOKLAB\pzkrk'
  ue_pc_password: 'NokiaBts2003'
  ue_pc_port: '8080'
UE_POOLS:
    TafUeAndroidPool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'xyz'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    server_close_delay: 180
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        << : *UE_PC_1
                        qualcomm_prototype: True
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: 1
