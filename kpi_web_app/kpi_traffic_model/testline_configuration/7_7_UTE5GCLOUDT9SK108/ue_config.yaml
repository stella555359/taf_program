UE_POOLS:
    TafUeAtPool:  # UE Pool class defined by library
        inline_config:
            QUECTEL_UE:                  # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with `Require UE` keyword)
                    - QUECTEL_UE
                CLASS: Quectel
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                    com_port: '26'        # number of COM port supporting AT commands
                    configuration:
                        ue_pc_address: 'PLKR-SG07-25.intra.noklab.net'      # UE PC domain address or IP
                        #              'plkr-sc5g-pc93.intra.noklab.net' = '10.83.179.135'
                        ue_pc_login: 'pzkrk'
                        ue_pc_password: 'NokiaBts2003'
                        ue_pc_port: 80                                      # OPTIONAL, defaults to 80 (taf.ue.proxy)
                        ue_pc_expected_prompt: 'pzkrk@PLKR-SG07-25'         # OPTIONAL but if you want to run dt from ue pc interface is mandatory
                        expected_prompt: 'pzkrk@PLKR-SG07-25'
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 7'                  # OPTIONAL
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
