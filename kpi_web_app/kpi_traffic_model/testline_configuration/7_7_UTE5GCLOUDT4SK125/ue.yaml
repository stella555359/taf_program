AppServer1: &APP_1
   address: '10.84.168.121'
   user: '5g'
   password: '5g'
   bind_interface_ip: '10.84.169.61'

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            ANDROID_UE_1:
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor
                    serial_number: 'R5CR418HMSR'                                             # UE serial number (can be obtained via 'adb devices'
                    configuration:
                        ue_pc_address: 'PLKR-SG07-08.intra.noklab.net'
                        login: 'pzkrk'                # SSH login to UE PC
                        password: 'NokiaBts2003'               # SSH pass
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
            ANDROID_UE_2:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE_2
                    - REAL_ANDROID_UE_2
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor
                    serial_number: 'R3CR104BZKE'                                             # UE serial number (can be obtained via 'adb devices'
                    configuration:
                        ue_pc_address: 'PLKR-SG07-08.intra.noklab.net'
                        login: 'pzkrk'                # SSH login to UE PC
                        password: 'NokiaBts2003'               # SSH pass
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
                            ping:
                                app_server: *APP_1
                                interval: 1
                            ftp:
                                app_server: *APP_1
